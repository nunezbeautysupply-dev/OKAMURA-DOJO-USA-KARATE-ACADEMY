  --fondo:#2f3438; --tarjeta:#3b4147; --tarjeta2:#454c53; --tarjeta3:#484f56;
  --linea:#626b74; --texto:#f3f5f6; --texto2:#bcc4cb; --texto3:#b7c0c8;
  --rojo:#f2b3ae; --verde:#98d1a6; --ambar:#e4c26f; --plata:#c3cbd2; --salio:#f0baba;
  --r:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--fondo);color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16.5px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:66px}
.num{font-variant-numeric:tabular-nums;letter-spacing:.2px}
.verde{color:var(--verde)} .ambar{color:var(--ambar)} .gris{color:var(--texto2)}
.rojo{color:var(--rojo)}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit;font-size:16.5px;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:17.5px;background:var(--tarjeta3);color:var(--texto);
  border:1px solid var(--linea);border-radius:var(--r);padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--plata);outline-offset:-1px}
input::placeholder,textarea::placeholder{color:#c2cad1;opacity:1}
input[type=date],input[type=time],input[type=file]{color-scheme:dark}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--texto2) 50%),linear-gradient(135deg,var(--texto2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:28px}

#barra{position:sticky;top:0;z-index:40;background:#383e43;border-bottom:1px solid var(--linea);
  display:flex;align-items:center;gap:8px;padding:9px 11px}
#barra .marca{font-size:14px;font-weight:700;letter-spacing:1.1px;color:var(--rojo);
  text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icobtn{background:var(--tarjeta2);border:1px solid var(--linea);border-radius:var(--r);padding:6px 10px;font-size:17.5px;line-height:1}

.wrap{max-width:660px;margin:0 auto;padding:11px}
.vista{display:none} .vista.on{display:block}

.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);padding:11px;margin-bottom:9px}
.card.tight{padding:9px}
.hd{font-size:14.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--texto3);margin-bottom:8px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:6px 0}
.fila+.fila{border-top:1px solid var(--linea)}
.fila .izq{min-width:0;flex:1}
.fila .n1{font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .n2{font-size:13.5px;color:var(--texto3);margin-top:2px}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--linea);margin-top:8px;padding-top:8px}
.total b{font-size:20px;font-weight:600}
.big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}

.btn{display:block;width:100%;background:var(--tarjeta2);border:1px solid var(--linea);
  border-radius:var(--r);padding:11px;text-align:center;font-weight:600;color:var(--texto);font-size:16.5px}
.btn:active{background:var(--tarjeta3)}
.btn.pri{background:var(--plata);color:#25292c;border-color:var(--plata)}
.btn.pri:active{background:#dde3e8}
.btn.rojo{background:#4e2c29;border-color:var(--rojo);color:var(--rojo)}
.btn.chico{padding:7px 11px;width:auto;display:inline-block;font-size:15px;font-weight:500}
.btn.peligro{color:var(--salio)}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rejilla .btn{text-align:left;padding:12px 11px;font-weight:500}
.rejilla .btn .e{display:block;font-size:19px;margin-bottom:3px}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campo{margin-bottom:10px}
.campo label{display:block;font-size:13.5px;color:var(--texto3);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.5px;font-weight:600}

/* ---- rejilla de caras para pasar lista ---- */
.caras{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:9px}
.cara{position:relative;background:var(--tarjeta2);border:2px solid var(--linea);border-radius:var(--r);
  padding:8px 4px 9px;text-align:center;overflow:hidden}
.cara.pres{border-color:var(--verde);background:#33503c}
.cara .foto{width:62px;height:62px;border-radius:50%;margin:0 auto 5px;background:var(--tarjeta3);
  background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--texto3);border:1px solid var(--linea)}
.cara .nom{font-size:15px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cara .cint{margin-top:3px;display:flex;align-items:center;justify-content:center;gap:3px}
.cara .tick{position:absolute;top:3px;right:5px;font-size:15.5px}
.pto{width:5px;height:5px;border-radius:50%;background:var(--texto2);display:inline-block}
.cinta{display:inline-block;width:38px;height:15px;border-radius:2px;vertical-align:middle;position:relative;
  overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.cinta i{position:absolute;left:0;right:0;top:33.33%;height:33.34%}
.cinta.sm{width:26px;height:11px}
.cinta.gr{width:66px;height:22px;border-radius:3px}

/* ---- foto en fichas ---- */
.avatar{width:64px;height:64px;border-radius:50%;background:var(--tarjeta3);background-size:cover;
  background-position:center;border:2px solid var(--linea);display:flex;align-items:center;
  justify-content:center;font-size:24px;color:var(--texto3);flex:none}
.avatar.sm{width:40px;height:40px;font-size:17.5px;border-width:1px}

.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.pill{background:var(--tarjeta2);border:1px solid var(--linea);border-radius:20px;padding:5px 12px;font-size:14.5px;color:var(--texto2)}
.pill.sel{background:var(--plata);color:#25292c;border-color:var(--plata);font-weight:600}
.chip{display:inline-block;background:var(--tarjeta3);border-radius:4px;padding:1px 7px;font-size:12.5px;
  color:var(--texto2);margin-left:5px;vertical-align:middle}
.chip.v{background:#33503c;color:var(--verde)} .chip.a{background:#514630;color:var(--ambar)}
.chip.r{background:#4e2c29;color:var(--rojo)}

.nota{background:var(--tarjeta2);border-left:3px solid var(--plata);border-radius:0 var(--r) var(--r) 0;
  padding:9px 11px;font-size:14.5px;color:var(--texto2);margin-bottom:9px}
.nota.al{border-left-color:var(--ambar);color:#e8d3a2}
.nota.ok{border-left-color:var(--verde);color:#b6d9c0}
.nota.err{border-left-color:var(--salio);color:#e5bcbc}
.vacio-msj{text-align:center;color:var(--texto3);padding:28px 12px;font-size:15px}
.barra-b{height:8px;background:var(--tarjeta3);border-radius:4px;overflow:hidden;margin-top:5px}
.barra-b i{display:block;height:100%;background:var(--plata);border-radius:4px}
.barra-b.v i{background:var(--verde)} .barra-b.a i{background:var(--ambar)}
.sep{height:1px;background:var(--linea);margin:10px 0}
.mini{font-size:13.5px;color:var(--texto3)}

#abajo{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#383e43;border-top:1px solid var(--linea);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
#abajo button{flex:1;padding:8px 2px 9px;color:var(--texto3);font-size:11.5px;font-weight:600;
  letter-spacing:.3px;border-top:2px solid transparent}
#abajo button .e{display:block;font-size:18px;margin-bottom:2px;filter:grayscale(.5)}
#abajo button.on{color:var(--plata);border-top-color:var(--plata)}
#abajo button.on .e{filter:none}

.capa{position:fixed;inset:0;z-index:60;background:rgba(16,18,20,.74);display:none;align-items:flex-end;justify-content:center}
.capa.on{display:flex}
.hoja{background:var(--tarjeta);width:100%;max-width:660px;max-height:88vh;overflow-y:auto;
  border-radius:12px 12px 0 0;border:1px solid var(--linea);border-bottom:none;
  padding:12px 12px calc(15px + env(safe-area-inset-bottom))}
.hoja-tit{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;
  position:sticky;top:-12px;background:var(--tarjeta);padding:5px 0 9px;z-index:2}
.hoja-tit h3{font-size:16.5px;letter-spacing:.3px}
.op{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 4px;
  border-bottom:1px solid var(--linea);font-size:16.5px;text-align:left;gap:9px}
.op:active{background:var(--tarjeta2)}
.op .fl{color:var(--texto3);font-size:13.5px}
.grupo-tit{font-size:12.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--texto3);
  margin:13px 0 4px;padding-top:9px;border-top:1px solid var(--linea)}
.grupo-tit:first-of-type{border-top:none;padding-top:0;margin-top:4px}

#pantalla-login{position:fixed;inset:0;z-index:90;background:var(--fondo);display:flex;
  align-items:center;justify-content:center;padding:22px}
#pantalla-login .caja{width:100%;max-width:340px;text-align:center}
#pantalla-login .sello{width:74px;height:74px;margin:0 auto 16px}
#pantalla-login .marca{font-size:16.5px;font-weight:700;letter-spacing:2px;color:var(--rojo);
  text-transform:uppercase;line-height:1.5}
#pantalla-login .sub{font-size:12.5px;color:var(--texto3);letter-spacing:1.4px;text-transform:uppercase;margin:6px 0 26px}

table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--texto3);
  text-align:center;padding:5px 4px;border-bottom:1px solid var(--linea);font-weight:700}
table.t th:first-child{text-align:left}
table.t td{padding:6px 4px;border-bottom:1px solid var(--linea);text-align:center;font-variant-numeric:tabular-nums}
table.t td:first-child{text-align:left}
table.t tr:last-child td{border-bottom:none}
.puntaje{display:flex;gap:6px}
.puntaje button{flex:1;padding:9px 0;border:1px solid var(--linea);border-radius:var(--r);
  background:var(--tarjeta2);font-weight:600;font-size:16.5px}
.puntaje button.sel{background:var(--plata);color:#25292c;border-color:var(--plata)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(14px);
  background:var(--tarjeta3);border:1px solid var(--linea);color:var(--texto);padding:10px 16px;
  border-radius:20px;font-size:15px;z-index:95;opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foto-prev{max-width:100%;border-radius:var(--r);border:1px solid var(--linea);margin-top:7px}
#capa-aviso{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.72);
  align-items:center;justify-content:center;padding:20px}
#capa-aviso.on{display:flex}
.avisocaja{background:var(--tarjeta);border:2px solid var(--ambar);border-radius:14px;padding:16px;
  max-width:340px;width:100%;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.avisocaja.peligro{border-color:var(--rojo)}
.avisocaja.ok{border-color:var(--verde)}
.avisotit{font-size:17.5px;font-weight:700;margin-bottom:8px}
.avisotx{font-size:15px;color:var(--texto2);margin-bottom:6px}
.avisotx.rojo{color:var(--rojo)}
.avisolista{margin:0 0 10px 18px;padding:0;font-size:15px;color:var(--texto)}
.avisolista li{margin-bottom:3px}
input.malo,select.malo,textarea.malo{border-color:var(--rojo)!important;background:#4a3230!important}
#btn-menu{background:var(--rojo)!important;color:#2f3438!important;border-radius:9px!important;
  width:44px;height:38px;font-size:22px;font-weight:700;border:0;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.dibcaja{background:var(--tarjeta2);border:1px solid var(--linea);border-radius:10px;
  padding:8px;margin-top:10px}
svg.dib{width:100%;height:auto;display:block}
svg.dib .f1{fill:#4e2c29;stroke:var(--rojo);stroke-width:1}
svg.dib .f2{fill:var(--tarjeta3,#4d545b);stroke:var(--linea);stroke-width:1}
svg.dib .f3{fill:#4e2c29;stroke:var(--rojo);stroke-width:1}
svg.dib .f4{fill:none;stroke:var(--linea);stroke-width:1;stroke-dasharray:3 2}
svg.dib .f5{fill:#33503c;stroke:var(--verde);stroke-width:1}
svg.dib .ln{stroke:var(--linea);stroke-width:1;fill:none}
svg.dib .fl{stroke:var(--texto3);stroke-width:1.4;fill:none;marker-end:url(#p)}
svg.dib text{font:10.5px system-ui,sans-serif;text-anchor:middle}
svg.dib .tc{fill:var(--rojo);font-weight:700}
svg.dib .tc2{fill:var(--texto);font-weight:600}
svg.dib .tc3{fill:var(--texto3)}
svg.dib .tc4{fill:var(--texto2);text-anchor:start}
.emo{font-size:1.28em;line-height:1;display:inline-block;vertical-align:-0.12em}
.hd .emo,.n2 .emo,.mini .emo,.chip .emo{font-size:1.35em}
.btn .emo{font-size:1.3em}
#abajo button .e,.rejilla .btn .e{font-size:23px!important}
#abajo button .e{filter:drop-shadow(0 0 1px rgba(255,255,255,.5))!important}
svg.carita{width:62%;height:62%;fill:#8fa0b2;display:block}
.avatar svg.carita{width:60%;height:60%}
.avatar.sm svg.carita{width:64%;height:64%}
.visor .sinfoto svg.carita{width:120px;height:120px;fill:#9fb0c2;margin:0 auto}
.avatar{display:flex;align-items:center;justify-content:center}
svg.ic{width:1.25em;height:1.25em;fill:currentColor;display:inline-block;vertical-align:-0.22em}
.rejilla .btn .e svg.ic{width:26px;height:26px;fill:#0d1013;vertical-align:0}
#abajo button .e svg.ic{width:24px;height:24px;fill:currentColor;vertical-align:0}
a[href^="tel:"] svg.ic,a[href^="sms:"] svg.ic{width:20px;height:20px;fill:currentColor;vertical-align:-0.25em}
/* embudo de prospectos */
.embudo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.embudo .paso{border:2px solid var(--linea);border-radius:10px;padding:8px 4px;text-align:center}
.embudo .num{font-size:22px;font-weight:800;line-height:1}
.embudo .et{font-size:11px;color:var(--texto3);margin-top:3px;line-height:1.15}
/* panel de retención */
.mesfila{display:grid;grid-template-columns:38px 1fr 62px 70px;gap:7px;align-items:center;margin-bottom:7px}
.mesnom{font-size:13px;color:var(--texto3);font-weight:700}
.mesbarra{position:relative;background:var(--tarjeta2);border-radius:6px;height:24px;overflow:hidden}
.mesbarra i{position:absolute;left:0;top:0;bottom:0;background:#2f5d8a;border-radius:6px}
.mesbarra b{position:relative;z-index:2;font-size:13px;padding-left:7px;line-height:24px}
.mesmov{font-size:13.5px;white-space:nowrap}
/* kiosco */
#kiosco{display:none}
body.en-kiosco #kiosco{display:block;position:fixed;inset:0;z-index:400;background:#000;overflow-y:auto;padding:14px}
body.en-kiosco #barra,body.en-kiosco #abajo,body.en-kiosco .wrap{display:none!important}
.k-top{text-align:center;margin-bottom:14px}
.k-tit{font-size:20px;font-weight:800;color:var(--acento);letter-spacing:1px}
.k-sub{font-size:15px;color:var(--texto2);margin-top:4px}
.k-grupos{display:flex;gap:7px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.k-rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.k-cara{background:var(--tarjeta);border:2px solid var(--linea);border-radius:14px;padding:9px 5px;
  color:var(--texto);cursor:pointer;text-align:center}
.k-cara.si{background:#12331f;border-color:var(--verde)}
.k-foto{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;background:var(--tarjeta2) center/cover;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.k-nom{font-size:14px;font-weight:600;line-height:1.2}
.k-ok{font-size:12px;color:var(--verde);font-weight:700;margin-top:3px}
.k-salir{display:block;margin:20px auto 8px;background:var(--tarjeta2);border:1px solid var(--linea);
  color:var(--texto3);border-radius:10px;padding:11px 20px;font:inherit;font-size:14px;cursor:pointer}
.firmacanvas{width:100%;height:160px;background:var(--campos);border:1px dashed var(--linea);
  border-radius:9px;touch-action:none;display:block}
.condrop{position:relative}
.drop{display:none;position:absolute;left:0;right:0;top:100%;z-index:60;margin-top:3px;
  background:var(--tarjeta2);border:1px solid var(--linea);border-radius:9px;
  max-height:230px;overflow-y:auto;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.drop.on{display:block}
.dropop{display:block;width:100%;text-align:left;background:none;border:0;color:var(--texto);
  padding:9px 11px;font:inherit;font-size:15px;border-bottom:1px solid var(--linea);cursor:pointer}
.dropop:last-child{border-bottom:0}
.dropop:active,.dropop.sel{background:#4e2c29;color:var(--rojo)}
.dropop.otro{color:var(--ambar);font-weight:600}
.selbtn{width:100%;display:flex;justify-content:space-between;align-items:center;
  background:var(--campos);border:1px solid var(--linea);border-radius:8px;color:var(--texto);
  padding:10px 11px;font:inherit;font-size:15.5px;text-align:left;cursor:pointer}
#capa-foto{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);
  align-items:center;justify-content:center;padding:16px}
#capa-foto.on{display:flex}
.visor{max-width:100%;text-align:center}
.visor img{max-width:100%;max-height:66vh;border-radius:12px;display:block}
.visor .pie{color:#fff;font-size:16.5px;font-weight:600;margin-top:10px}
.visor .sinfoto{font-size:64px;color:#889;padding:40px}
.cerrar-visor{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.16);border:0;
  color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer}
.avatar.tocable{cursor:pointer}
.tresc{display:grid;grid-template-columns:1.4fr .7fr .9fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-size:14.5px;padding:5px 0;cursor:pointer}
.check input{width:17px;height:17px;flex:none;accent-color:var(--rojo)}
.diassem{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.diassem .dia{background:var(--campos);border:1px solid var(--linea);border-radius:6px;
  padding:6px 2px;text-align:center;font-size:12px;font-weight:700;color:var(--texto3);cursor:pointer}
.diassem .dia.on{background:#4e2c29;border-color:var(--rojo);color:var(--rojo)}
.diassem .dia input{display:none}
.calc{background:var(--tarjeta2);border:1px solid var(--linea);border-radius:8px;padding:8px 10px;margin-top:9px}
textarea{width:100%;background:var(--campos);border:1px solid var(--linea);border-radius:8px;
  color:var(--texto);padding:9px;font:inherit;font-size:15.5px;resize:vertical}
.aviso{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;margin-bottom:6px;
  font-size:14px;background:var(--tarjeta2);border:1px solid var(--linea)}
.aviso.cump{background:#3d3a2b;border-color:#6b6238}
.aviso.deu{background:#4a3327;border-color:#7a5334}
.aviso.bec{background:#2f3f46;border-color:#4c6672}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#pantalla-login .sello,#barra .marca i{background:var(--logo) center/contain no-repeat}
#barra .marca i{width:19px;height:19px;display:inline-block;vertical-align:-4px;margin-right:6px}

/* ===== ESTILO NEGRO PURO ===== */

/* 1. los íconos ya no van apagados y llevan su propio color */
#abajo button .e{filter:none!important;font-size:22px!important}
.rejilla .btn .e{filter:none!important}
/* 2. cada botón del tablero con su color, para reconocerlo de un vistazo */
.rejilla .btn{position:relative;display:flex!important;flex-direction:column;align-items:center;
  justify-content:flex-start;text-align:center!important;gap:8px;
  padding:14px 8px 13px!important;min-height:116px;line-height:1.25;word-break:normal;overflow-wrap:anywhere}
.rejilla .btn .e{color:#0d1013!important;filter:drop-shadow(0 0 1.1px rgba(0,0,0,.9)) drop-shadow(0 1px 1px rgba(0,0,0,.45))!important;
  display:flex!important;align-items:center;justify-content:center;flex:none;
  width:46px;height:46px;border-radius:13px;margin:0!important;font-size:22px!important}
.rejilla .btn:nth-child(1) .e{background:var(--ic1)}
.rejilla .btn:nth-child(2) .e{background:var(--ic2)}
.rejilla .btn:nth-child(3) .e{background:var(--ic3)}
.rejilla .btn:nth-child(4) .e{background:var(--ic4)}
.rejilla .btn:nth-child(5) .e{background:var(--ic5)}
.rejilla .btn:nth-child(6) .e{background:var(--ic6)}
/* 3. la barra de abajo: el activo se ve de verdad */
#abajo button.on{color:var(--acento)!important}
#abajo button.on .e{transform:scale(1.08)}
#abajo button{min-height:56px}
/* 4. el teléfono ya no es un enlace azul invisible */
a[href^="tel:"], a[href^="sms:"]{color:var(--acento)!important;font-weight:600}
/* 5. zonas tocables de al menos 44px */
.btn.chico{min-height:44px!important}
#btn-menu{width:48px!important;height:44px!important}
/* 6. los chips más legibles */
.chip{font-size:13.5px!important;padding:3px 9px!important;font-weight:600}

 --fondo:#000000; --tarjeta:#15181c; --tarjeta2:#1f242b; --tarjeta3:#2a3037;

/* pasa los datos viejos (8 cinturones) a la escalera nueva, sin perder alumnos */
/* pone el pénsum en los datos viejos y amarra los escalones a su grado */
function migrarPensum(){
  if(!D) return false;
  let cambio=false;
  if(!D.pensum || !D.pensum.length){ D.pensum=JSON.parse(JSON.stringify(PENSUM_FABRICA)); cambio=true; }
  /* a qué grado pertenece cada escalón, por nombre */
  const mapa={'Blanco · raya amarilla':'9no kyu','Cinturón amarillo':'8vo kyu',
    'Cinturón naranja':'7mo kyu','Cinturón verde':'6to kyu','Cinturón azul':'5to kyu',
    'Cinturón morado':'4to kyu','Cinturón marrón · 3er kyu':'3er kyu',
    'Cinturón marrón · 2do kyu':'2do kyu','Cinturón marrón · 1er kyu':'1er kyu',
    'Cinturón negro · Shodan':'Shodan'};
  /* los escalones de raya toman la PRIMERA MITAD de las técnicas del grado que viene */
  const medios={'Amarillo · raya naranja':'7mo kyu','Naranja · raya verde':'6to kyu',
    'Verde · raya azul':'5to kyu','Azul · raya morada':'4to kyu','Morado · raya marrón':'3er kyu'};
  (D.cinturones||[]).forEach(c=>{
    if(c.kyuId!==undefined) return;
    cambio=true;
    if(mapa[c.nombre]){
      c.kyuId=mapa[c.nombre]; c.reqs=[];
      const g=D.pensum.find(x=>x.kyu===c.kyuId);
      if(g){ c.clases=g.sesiones||c.clases;
        /* al escalón de color le toca TODO su grado menos lo que se adelantó en el medio */
        c.reqs=g.requisitos.map(r=>r.id); }
    } else if(medios[c.nombre]){
      c.kyuId=medios[c.nombre];
      const g=D.pensum.find(x=>x.kyu===c.kyuId);
      if(g){ const tec=g.requisitos.filter(r=>r.tipo==='tecnica');
        c.reqs=tec.slice(0, Math.ceil(tec.length/2)).map(r=>r.id); }
    } else { c.kyuId=''; c.reqs=[]; }
  });
  /* al escalón de color se le quita lo que ya pidió el medio anterior */
  const orden=(D.cinturones||[]).slice().sort((a,b)=>a.orden-b.orden);
  orden.forEach((c,i)=>{
    if(!medios[c.nombre]) return;
    const sig=orden[i+1];
    if(sig && sig.kyuId===c.kyuId && sig.reqs){
      sig.reqs=sig.reqs.filter(id=>!(c.reqs||[]).includes(id));
    }
  });
  /* las técnicas de fábrica eran de otro estilo: se quitan.
     Las que el maestro haya agregado a mano SE RESPETAN. */
  const deFabrica=new Set(); Object.values(TECNICAS_FABRICA).forEach(l=>l.forEach(t=>deFabrica.add(t)));
  (D.cinturones||[]).forEach(c=>{
    const antes=(c.tecnicas||[]).length;
    c.tecnicas=(c.tecnicas||[]).filter(t=>!deFabrica.has(t.nombre));
    if(c.tecnicas.length!==antes) cambio=true;
  });
  const vivas=new Set(); (D.cinturones||[]).forEach(c=>(c.tecnicas||[]).forEach(t=>vivas.add(t.id)));
  (D.alumnos||[]).forEach(a=>{ a.tecnicas=(a.tecnicas||[]).filter(x=>vivas.has(x)); });
  if(cambio) log('Cargó el pénsum de Goju Ryu y amarró los escalones a sus grados');
  return cambio;
}

function migrarCinturones(){
  if(!D || !D.cinturones) return false;
  if(D.cinturones.some(c=>c.base)) return false;          // ya estaba migrado
  const equiv={'Blanco':'Cinturón blanco','Amarillo':'Cinturón amarillo','Naranja':'Cinturón naranja',
    'Verde':'Cinturón verde','Azul':'Cinturón azul','Morado':'Cinturón morado',
    'Marrón':'Cinturón marrón · 3er kyu','Negro':'Cinturón negro · Shodan'};
  const viejos=D.cinturones.slice();
  const nuevos=cinturonesDeFabrica();
  const porNombre={}; nuevos.forEach(c=>porNombre[c.nombre]=c);
  const mapa={};
  viejos.forEach(v=>{ const n=porNombre[equiv[v.nombre]||v.nombre]; if(n) mapa[v.id]=n.id; });
  /* las técnicas que el maestro haya agregado a mano se conservan */
  viejos.forEach(v=>{ const n=porNombre[equiv[v.nombre]||v.nombre]; if(!n) return;
    (v.tecnicas||[]).forEach(t=>{ if(!n.tecnicas.some(x=>x.nombre===t.nombre)) n.tecnicas.push({id:t.id,nombre:t.nombre}); });
    if(v.clases) n.clases=v.clases; if(v.meses) n.meses=v.meses; });
  D.cinturones=nuevos;
  (D.alumnos||[]).forEach(a=>{
    if(mapa[a.cinturonId]) a.cinturonId=mapa[a.cinturonId];
    else if(!porId(D.cinturones,a.cinturonId)) a.cinturonId=nuevos[0].id;
    (a.historial||[]).forEach(x=>{ if(mapa[x.cinturonId]) x.cinturonId=mapa[x.cinturonId]; });
  });
  (D.examenes||[]).forEach(e=>{ if(mapa[e.cinturonId]) e.cinturonId=mapa[e.cinturonId];
    (e.alumnos||[]).forEach(x=>{ if(mapa[x.deId]) x.deId=mapa[x.deId]; if(mapa[x.aId]) x.aId=mapa[x.aId]; }); });
  log('Pasó los cinturones a la escalera de grados nueva');
  return true;
}

/* ---------- clave ---------- */
async function hash(clave,sal){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey('raw',enc.encode(clave),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(sal),iterations:150000,hash:'SHA-256'},k,256);
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function msjLogin(t){const e=$('login-msj');if(!t){e.style.display='none';return;}e.textContent=t;e.style.display='block';}
async function crearClave(){
  const a=$('cl1').value,b=$('cl2').value;

  D=datosNuevos();
  const sal=uid()+uid();
  D.clave={sal,h:await hash(a,sal)};
  log('Se creó la clave de la app');
  if(!guardar()) return;
  abrirApp();
}
async function entrar(){

  if(!c) return msjLogin('Escribe tu clave.');
  if(await hash(c,D.clave.sal)!==D.clave.h) return msjLogin('Clave incorrecta.');

}

function hayHuella(){ return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
async function huellaDisponible(){
  if(!hayHuella()) return false;
  try{ if(PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){}
  return false;
}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const deB64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');const b=atob(s);
  const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;};
const azar=n=>crypto.getRandomValues(new Uint8Array(n));
async function registrarHuella(){
  if(!await huellaDisponible())
    return alert('Este aparato no ofrece lector de huella al navegador.\n\nEn el teléfono suele funcionar; en una PC de escritorio muchas veces no.');
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:azar(32), rp:{name:'Okamura Dojo'},
      user:{id:azar(16),name:'sensei',displayName:'Sensei'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000, attestation:'none'}});
    if(!cred) return toast('No se registró la huella.');
    D.config.huella={activa:true,id:b64(cred.rawId)};
    log('Registró la huella en este aparato'); guardar(); toast('Huella registrada'); pintar();
  }catch(e){ alert('No se pudo registrar la huella ('+(e&&e.name||'error')+').'); }
}

  D.config.huella=null; log('Quitó la huella'); guardar(); toast('Huella quitada'); pintar();
}
async function pedirHuella(){
  const h=D.config.huella; if(!h||!h.activa||!h.id) return false;
  try{ return !!await navigator.credentials.get({publicKey:{challenge:azar(32),timeout:60000,
    userVerification:'required',allowCredentials:[{type:'public-key',id:deB64(h.id)}]}}); }
  catch(e){ return false; }
}

/* clases a las que vino un alumno desde una fecha */
/* estricto = solo las clases DESPUÉS de esa fecha.
   Se usa al promover: la clase del día del examen fue entrenando
   con el cinturón viejo, no cuenta para el grado nuevo. */
function clasesDesde(alumnoId,desdeISO,estricto){
  let n=0;
  D.asistencia.forEach(s=>{
    if(desdeISO){ if(estricto ? s.fecha <= desdeISO : s.fecha < desdeISO) return; }
    if((s.presentes||[]).includes(alumnoId)) n++;
  });
  return n;
}
function totalClases(alumnoId){ return clasesDesde(alumnoId,null); }
function ultimaClase(alumnoId){
  let u=null;
  D.asistencia.forEach(s=>{ if((s.presentes||[]).includes(alumnoId)) { if(!u||s.fecha>u) u=s.fecha; } });
  return u;
}
/* desde cuándo tiene el cinturón actual */
function desdeCinturon(a){
  if(a.historial && a.historial.length){
    const ult=a.historial.slice().sort((x,y)=>x.fecha.localeCompare(y.fecha)).slice(-1)[0];
    if(ult && ult.fecha) return ult.fecha;
  }
  return a.desde||a.creado||hoyISO();
}
/* ¿puede examinarse? */
function elegibilidad(a){
  const c=cintDe(a), sig=siguienteCint(c);
  const d0=desdeCinturon(a), hoy=hoyISO();
  /* Sensei decidió que la clase del día del examen SÍ cuenta para el grado nuevo */
  const clases=clasesDesde(a.id,d0,false);
  const meses=mesesEntre(d0,hoy);
  const reqs=(sig?requisitosDeCinturon(sig):[]);
  const tot=reqs.length;
  const hechas=reqs.filter(r=>(a.tecnicas||[]).includes(r.id)).length;
  const faltanClases=Math.max(0,(c&&c.clases||0)-clases);
  const faltanMeses=Math.max(0,(c&&c.meses||0)-meses);
  const faltanTec=Math.max(0,tot-hechas);
  return {c,sig,clases,meses,tot,hechas,faltanClases,faltanMeses,faltanTec,
    listo: !sig? false : (faltanClases===0 && faltanMeses===0 && faltanTec===0),
    casi: !sig? false : (faltanClases+faltanMeses+faltanTec)>0 && (faltanClases<=4 && faltanMeses<=1 && faltanTec<=2)};
}

function grupoDeHoy(){
  const d=new Date().getDay();
  const gs=D.grupos.filter(g=>g.activo!==false && (g.dias||[]).includes(d));
  return gs.length?gs:D.grupos.filter(g=>g.activo!==false);
}
function seDespegan(){
  const hoy=hoyISO(), out=[];
  alumnosActivos().forEach(a=>{
    const u=ultimaClase(a.id);
    if(!u){ if(diasEntre(a.desde||hoy,hoy)>21) out.push({a,dias:diasEntre(a.desde,hoy),nunca:true}); return; }
    const d=diasEntre(u,hoy);
    if(d>=14) out.push({a,dias:d,nunca:false});
  });
  return out.sort((x,y)=>y.dias-x.dias);
}

function asistenciaReciente(alumnoId,n){
  const a=porId(D.alumnos,alumnoId); if(!a) return {vino:0,total:0};

}
let FOTO_TMP='';

function comprimirFoto(file,cb){
  const fr=new FileReader();
  fr.onload=e=>{ const img=new Image();
    img.onload=()=>{
      const max=380, s=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*s), h=Math.round(img.height*s);
      const lado=Math.min(w,h);
      const cv=document.createElement('canvas'); cv.width=lado; cv.height=lado;
      const cx=cv.getContext('2d');
      cx.drawImage(img,(w-lado)/2/s,(h-lado)/2/s,lado/s,lado/s,0,0,lado,lado);

/* ---------- dinero: campo de texto que sí acepta el punto ---------- */
/* lee un monto escrito como sea: 80 · 80.5 · 80,50 · 1,234.50 · 1.234,50 · $80 */
function textoAPlata(txt){
  let t=String(txt==null?'':txt).trim();
  if(t==='') return '';
  if(!/[0-9]/.test(t)) return '';
  t=t.replace(/[^0-9.,]/g,'');
  const coma=t.lastIndexOf(','), punto=t.lastIndexOf('.');
  if(coma>=0 && punto>=0){
    if(coma>punto) t=t.replace(/\./g,'').replace(',','.');   /* 1.234,50 */
    else t=t.replace(/,/g,'');                                /* 1,234.50 */
  } else if(coma>=0){
    const dec=t.length-coma-1;
    t = (dec===3) ? t.replace(/,/g,'') : t.replace(',','.');  /* 1,234 vs 12,50 */
  }
  t=t.replace(/\.(?=.*\.)/g,'');
  const v=parseFloat(t);
  return isNaN(v)? '' : n2(Math.abs(v));
}
function leerPlata(id){ const e=$(id); return e? textoAPlata(e.value) : ''; }

let AUDIO_CTX=null;
function sonidoEncendido(){ return !(D&&D.config&&D.config.sonido===false); }
function tono(frecs,dur,vol){
  if(!sonidoEncendido()) return;
  try{
    AUDIO_CTX = AUDIO_CTX || new (window.AudioContext||window.webkitAudioContext)();
    if(AUDIO_CTX.state==='suspended') AUDIO_CTX.resume();
    let t=AUDIO_CTX.currentTime;
    frecs.forEach((f,i)=>{
      const o=AUDIO_CTX.createOscillator(), g=AUDIO_CTX.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||0.22,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(AUDIO_CTX.destination);
      o.start(t); o.stop(t+dur); t+=dur*0.82;
    });
  }catch(e){}
}

/* =========================== BOTÓN DE ATRÁS =========================== */
let PILA=['inicio'], SALIENDO=false, NAV_LISTA=false;
/* PASOS = cuántos escalones de historial tenemos guardados nosotros.
   Siempre mantenemos un colchón, para que el botón de atrás del teléfono
   NUNCA se quede sin escalón y cierre la app sin preguntar. */
let PASOS=0;
const COLCHON=3;
function marcarPaso(){
  try{ history.pushState({dojo:1,n:PASOS+1},''); PASOS++; }catch(e){}
}
function rellenarColchon(){
  let guarda=0;
  while(PASOS<COLCHON && guarda++<8) marcarPaso();
}
function iniciarNavegacion(){
  if(NAV_LISTA) return; NAV_LISTA=true;
  rellenarColchon();
  window.addEventListener('popstate',()=>{
    if(SALIENDO) return;                 /* nos estamos yendo de verdad */
    PASOS=Math.max(0,PASOS-1);
    /* 1 · primero se cierra lo que esté encima */
    if($('capa-foto') && $('capa-foto').classList.contains('on')){ cerrarFoto(); rellenarColchon(); return; }
    if(document.querySelector('.drop.on')){ cerrarDrops(); rellenarColchon(); return; }
    if($('capa') && $('capa').classList.contains('on')){ cerrarHoja(); rellenarColchon(); return; }
    /* 2 · si hay pantalla anterior, volvemos a ella */
    if(PILA.length>1){ PILA.pop(); irSinPila(PILA[PILA.length-1]); rellenarColchon(); return; }
    /* 3 · estamos en Inicio: se pregunta, y NO se sale hasta que él diga */
    rellenarColchon();
    preguntarSalir();
  });
  /* si el teléfono nos deja sin colchón por lo que sea, lo reponemos */
  setInterval(()=>{ if(NAV_LISTA && !SALIENDO && PASOS<2) rellenarColchon(); }, 4000);
}
function irSinPila(v){
  vistaActual=v;
  document.querySelectorAll('.vista').forEach(e=>e.classList.remove('on'));
  const el=$('v-'+v); if(el) el.classList.add('on');
  document.querySelectorAll('#abajo button').forEach(b=>b.classList.toggle('on',b.dataset.ir===v));
  pintar(); window.scrollTo(0,0);
}
function preguntarSalir(){
  if($('capa') && $('capa').classList.contains('on')) return;
  sonAlerta();
  hoja('¿Salir de la app?',`
   <div class="nota">Tus datos quedan guardados en este aparato. No se pierde nada.</div>
   <button class="btn peligro" style="margin-top:10px" onclick="salirDeVerdad()">Sí, salir</button>
   <button class="btn pri" style="margin-top:8px" onclick="cerrarHoja();rellenarColchon()">Quedarme aquí</button>`);
}
function salirDeVerdad(){
  cerrarHoja(); SALIENDO=true;
  const n=PASOS+1;
  try{ history.go(-n); }catch(e){}
  setTimeout(()=>{ try{ window.close(); }catch(e){}
    /* si el teléfono no dejó cerrar, seguimos como si nada */
    SALIENDO=false; PASOS=0; rellenarColchon(); }, 600);
}

async function actualizarAhora(){

  location.replace(location.pathname+'?v='+Date.now());
}

/* =========================== PÉNSUM DE GRADOS ===========================
   Los requisitos de verdad viven en el GRADO OFICIAL del pénsum.
   Cada escalón del dojo apunta a un grado y carga una PARTE de sus requisitos.
   En el examen se califica requisito por requisito: Excelente 3, Bueno 2,
   Promedio 1, o "no le toca" (0 y no cuenta para el máximo).
======================================================================== */
const NOTAS_PENSUM=[['3','Excelente'],['2','Bueno'],['1','Promedio'],['0','No le toca hoy']];
function pensum(){ return (D&&D.pensum)||[]; }
function gradoPensum(id){ return pensum().find(g=>g.kyu===id)||null; }
function reqDe(kyuId,reqId){ const g=gradoPensum(kyuId); if(!g) return null;
  return (g.requisitos||[]).find(r=>r.id===reqId)||null; }
function reqPorId(reqId){
  for(const g of pensum()){ const r=(g.requisitos||[]).find(x=>x.id===reqId); if(r) return {g,r}; }
  return null;
}
/* los requisitos que le tocan a un escalón */
function requisitosDeCinturon(c){
  if(!c||!c.kyuId) return [];
  const g=gradoPensum(c.kyuId); if(!g) return [];
  const ids=c.reqs&&c.reqs.length? c.reqs : (g.requisitos||[]).map(r=>r.id);
  return (g.requisitos||[]).filter(r=>ids.includes(r.id));
}
function porcentajeMinimo(g){ return g&&g.maxOficial? g.minOficial/g.maxOficial : 0.78; }

function asignarRequisitos(cid){
  const c=porId(D.cinturones,cid);
  const P=pensum();
  const g=gradoPensum(c.kyuId);
  const ids=c.reqs||[];
  hoja('Requisitos de '+c.nombre,`
   <div class="campo"><label>Grado del pénsum al que pertenece</label>
     <select id="as-kyu" onchange="cambiarKyuEscalon('${cid}',this.value)">
       <option value="">— ninguno (escalón libre) —</option>
       ${P.map(x=>`<option value="${esc(x.kyu)}"${x.kyu===c.kyuId?' selected':''}>${esc(x.kyu)} · ${esc(x.cinturon)}</option>`).join('')}
     </select></div>
   ${g?`<div class="mini" style="margin-bottom:8px">Marca lo que se le exige en <b>este</b> escalón.

    <div class="dosc" style="margin-bottom:8px">
      <button class="btn chico" onclick="marcarTodosReq('${cid}',true)">Marcar todo</button>

      <label class="check" style="align-items:flex-start">

    <button class="btn pri" style="margin-top:10px" onclick="guardarRequisitos('${cid}')">Guardar</button>`
   :'<div class="nota">Escoge primero a qué grado del pénsum pertenece este escalón.</div>'}`);
}
function cambiarKyuEscalon(cid,kyu){
  const c=porId(D.cinturones,cid);
  c.kyuId=kyu; c.reqs=[];
  const g=gradoPensum(kyu);
  if(g){ c.clases=g.sesiones||c.clases; }
  guardar(); cerrarHoja(); asignarRequisitos(cid);
}
function marcarTodosReq(cid,si){
  document.querySelectorAll('.as-req').forEach(x=>x.checked=si);
}
function guardarRequisitos(cid){
  const c=porId(D.cinturones,cid);
  c.reqs=[...document.querySelectorAll('.as-req:checked')].map(x=>x.value);
  log('Cambió los requisitos de '+c.nombre+' ('+c.reqs.length+')');
  guardar(); sonOK(); cerrarHoja(); toast('Guardado'); ir('cinturones');
}

/* ---------- el examen, requisito por requisito ---------- */
function notasDe(al){ al.notas=al.notas||{}; return al.notas; }
function requisitosDelExamen(al){
  const c=porId(D.cinturones,al.aId);
  const base=requisitosDeCinturon(c).map(r=>r.id);
  const extra=(al.extra||[]).filter(id=>!base.includes(id));
  return base.concat(extra);
}
function puntajeExamen(al){
  const ids=requisitosDelExamen(al), n=notasDe(al);
  let suma=0, cuentan=0;
  ids.forEach(id=>{ const v=Number(n[id]===undefined?3:n[id]);
    if(v>0){ suma+=v; cuentan++; } });
  const c=porId(D.cinturones,al.aId);
  const g=c?gradoPensum(c.kyuId):null;
  const max=cuentan*3;
  const min=Math.round(max*porcentajeMinimo(g));
  return {suma,max,min,cuentan,pasa:max>0&&suma>=min,
    pct: max? Math.round(suma/max*100):0};
}
function ponerNota(exId,i,reqId,v){
  const x=porId(D.examenes,exId); const al=x.alumnos[i];
  notasDe(al)[reqId]=Number(v);
  guardar(); PINTORES.examen();
}
function agregarRequisitoExamen(exId,i){
  const x=porId(D.examenes,exId); const al=x.alumnos[i];
  const puestos=requisitosDelExamen(al);
  hoja('Agregar un requisito del pénsum',`
   <div class="mini" style="margin-bottom:9px">Escoge cualquier requisito de cualquier grado.
     Se le suma a este alumno solo para este examen.</div>

/* agranda todos los emoji de la pantalla, de una vez y para siempre */
const RE_EMOJI=/[\u{2190}-\u{2BFF}\u{2600}-\u{27BF}\u{FE0F}\u{1F000}-\u{1FAFF}]/u;
function agrandarIconos(raiz){
  const zonas = raiz? [raiz] : [...document.querySelectorAll('.vista.on, #barra, #abajo, .hoja, .avisocaja, .visor')];
  zonas.forEach(z=>{
    if(!z) return;
    const w=document.createTreeWalker(z, NodeFilter.SHOW_TEXT, {acceptNode(n){
      const p=n.parentElement;
      if(!p) return NodeFilter.FILTER_REJECT;
      if(p.classList.contains('emo')) return NodeFilter.FILTER_REJECT;
      if(/^(SCRIPT|STYLE|INPUT|TEXTAREA|OPTION|SELECT|CANVAS|SVG|PATH)$/.test(p.tagName)) return NodeFilter.FILTER_REJECT;
      return RE_EMOJI.test(n.nodeValue||'') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }});
    const nodos=[]; let n; while(n=w.nextNode()) nodos.push(n);
    nodos.forEach(nodo=>{
      const t=nodo.nodeValue; const frag=document.createDocumentFragment();
      let buf='';
      for(const ch of t){
        if(RE_EMOJI.test(ch)){
          if(buf){ frag.appendChild(document.createTextNode(buf)); buf=''; }
          const s=document.createElement('span'); s.className='emo'; s.textContent=ch;
          frag.appendChild(s);
        } else buf+=ch;
      }
      if(buf) frag.appendChild(document.createTextNode(buf));
      nodo.parentNode.replaceChild(frag,nodo);
    });
  });
}

/* ---------- edad ---------- */
function edadDe(nacim){
  if(!nacim) return null;
  const [a,m,d]=String(nacim).split('-').map(Number);
  if(!a) return null;
  const hoy=new Date(); let e=hoy.getFullYear()-a;
  const cumpleYa=(hoy.getMonth()+1>m)||((hoy.getMonth()+1===m)&&(hoy.getDate()>=d));
  if(!cumpleYa) e--;
  return e;
}
function esMenor(a){ const e=edadDe(a&&a.nacim); return e===null? false : e<18; }
/* cuántos días faltan para su cumpleaños */
function diasParaCumple(nacim){
  if(!nacim) return null;
  const [,m,d]=String(nacim).split('-').map(Number);
  if(!m||!d) return null;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  let c=new Date(hoy.getFullYear(),m-1,d);
  if(c<hoy) c=new Date(hoy.getFullYear()+1,m-1,d);
  return Math.round((c-hoy)/86400000);
}

/* ---------- autocompletar: junta lo que ya escribió antes ---------- */
function sugerencias(campo){
  const s=new Set();
  (D.alumnos||[]).forEach(a=>{
    const gente=[a,a.madre,a.padre,a.emerg].filter(Boolean);
    gente.forEach(p=>{
      if(campo==='nombre'){ if(p.nombre)s.add(p.nombre); if(p.nom)s.add(p.nom); }
      if(campo==='apellido'){ [p.apellido,p.apellido2,p.ape1,p.ape2].forEach(x=>{if(x)s.add(x);}); }
      if(campo==='calle'&&p.calle)s.add(p.calle);
      if(campo==='ciudad'&&p.ciudad)s.add(p.ciudad);
      if(campo==='zip'&&p.zip)s.add(p.zip);
      if(campo==='tel'){ [p.tel,p.telefono].forEach(x=>{if(x)s.add(x);}); }
    });
  });
  return [...s].filter(Boolean).sort();
}
function listaHTML(id,campo){
  return `<datalist id="${id}">${sugerencias(campo).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;

function calcCuota(){
  const bec=$('al-beca'), caja=$('al-becacaja');
  if(caja) caja.style.display = bec&&bec.checked ? 'grid' : 'none';
  const frec=$('al-frec')?$('al-frec').value:'mensual';
  const bp=leerPlata('al-cuota');
  const base = bp===''? n2(D.config.cuota) : bp;
  const f=porId(D.familias,$('al-fam').value);
  const desc = f&&Number(f.descuento)>0 ? n2(base*Number(f.descuento)/100) : 0;
  const neto = n2(base-desc);
  const veces = VECES_AL_MES[frec]||1;
  const becado = bec&&bec.checked;
  const etq = {semanal:'cada semana',quincenal:'cada quincena',mensual:'cada mes'}[frec];
  $('al-calc').innerHTML = `
    <div class="fila"><span class="gris">Cuota ${etq}</span><span class="mono">${money(base)}</span></div>
    ${desc?`<div class="fila"><span class="gris">Descuento de familia (−${f.descuento}%)</span><span class="mono ambar">−${money(desc)}</span></div>`:''}
    <div class="fila"><span><b>Le toca pagar ${etq}</b></span><span class="mono ${becado?'gris':'verde'}"><b>${becado?'—':money(neto)}</b></span></div>
    <div class="fila"><span class="gris">Al mes serían</span><span class="mono">${becado?'becado, no paga':money(n2(neto*veces))}</span></div>`;
}

function guardarAlumno(id,otroMas){
  limpiarMarcas();
  const menorAhora = esMenor({nacim:$('al-nacim').value||''});
  const pedir=[['al-nom','Primer nombre'],['al-ape','Apellido paterno'],
    ['al-nacim','Fecha de nacimiento'],['al-calle','Dirección'],['al-ciudad','Ciudad'],
    ['al-zip','Código postal'],['em-nom','Contacto de emergencia: nombre'],
    ['em-tel','Contacto de emergencia: teléfono']];
  if(menorAhora){ pedir.push(['ma-nom','Madre: nombre'],['ma-tel','Madre: teléfono']); }
  else { pedir.push(['al-tel','Teléfono del alumno']); }
  if(avisarFaltan(faltantes(pedir))) return;
  const n=($('al-nom').value||'').trim();
  const estadoAl=$('al-estadoal').value;
  const dias=[...document.querySelectorAll('.diassem input:checked')].map(x=>Number(x.value));
  const o={nombre:n, ini:($('al-ini').value||'').trim(),
    apellido:($('al-ape').value||'').trim(), apellido2:($('al-ape2').value||'').trim(),
    nacim:$('al-nacim').value||'', tel:($('al-tel').value||'').trim(),
    correo:($('al-correo').value||'').trim(),
    calle:($('al-calle').value||'').trim(), ciudad:($('al-ciudad').value||'').trim(),
    estado:$('al-estado').value, zip:($('al-zip').value||'').trim(),
    grupoId:$('al-grupo').value, desde:$('al-desde').value||hoyISO(),
    cinturonId:$('al-cint').value, dias, talla:$('al-talla').value,
    estadoAl, activo: estadoAl!=='baja',
    baja: estadoAl==='baja' ? ((porId(D.alumnos,id)||{}).baja || hoyISO()) : '',
    inscMonto: leerPlata('al-insc'),
    inscFecha: $('al-inscf').value||'', inscUniforme: $('al-inscuni').checked,
    frecuencia: $('al-frec').value,
    cuota: leerPlata('al-cuota'),
    familiaId:$('al-fam').value,
    beca:{activa:$('al-beca').checked, desde:$('al-becadesde').value||mesActual(),
          meses:Number($('al-becameses').value)||1},
    waiver:{firmado:$('al-waiver').checked, fecha:$('al-waiverf').value||''},
    medico:($('al-medico').value||'').trim(), recogen:($('al-recogen').value||'').trim(),
    permisoFotos:$('al-fotos').checked,
    nota:($('al-nota').value||'').trim()};
  const menor = esMenor({nacim:o.nacim});
  o.madre = menor ? (leerPersona('ma',false)||personaVacia()) : ((porId(D.alumnos,id)||{}).madre||personaVacia());
  o.padre = menor ? (leerPersona('pa',false)||personaVacia()) : ((porId(D.alumnos,id)||{}).padre||personaVacia());
  o.emerg = leerPersona('em',true)||personaVacia();
  if(FOTO_TMP) o.foto=FOTO_TMP;
  if(id){ Object.assign(porId(D.alumnos,id),o); log('Modificó a '+n); }
  else { D.alumnos.push({id:uid(),historial:[],tecnicas:[],rayas:0,creado:hoyISO(),...o});
    log('Agregó al alumno '+n); }
  if(!guardar()) return;
  sonOK(); toast('Guardado'); FOTO_TMP=''; ALUMNO_EDIT=null;
  if(otroMas){ cerrarHoja(); editarAlumno(); }
  else { cerrarHoja(); if(id){ ALUMNO_ACTUAL=id; ir('alumno'); } else ir('alumnos'); }
}

  else perm.push(`<span class="chip r">📄 falta el permiso</span>`);
  if(a.permisoFotos) perm.push(`<span class="chip v">📸 fotos OK</span>`);

  if(a.estadoAl==='pausa') perm.push(`<span class="chip a">⏸️ en pausa</span>`);
  const bec=a.beca||{};
  if(bec.activa) perm.push(`<span class="chip a">🎓 beca hasta ${esc(mesBonito(ultimoMesBeca(a)))}</span>`);
  return `<div class="card"><div class="hd">🪪 Sus datos</div>

    ${a.recogen?`<div class="fila"><span class="gris">🚸 Lo puede recoger</span><span>${esc(a.recogen)}</span></div>`:''}
    <div style="margin-top:9px;display:flex;flex-wrap:wrap;gap:5px">${perm.join('')}</div>
  </div>`;
}

/* ---------- AVISOS DE HOY ---------- */
function avisosDeHoy(){
  const hoy=hoyISO(), mk=mesActual(), out=[];
  alumnosActivos().forEach(a=>{
    const d=diasParaCumple(a.nacim);
    if(d!==null && d<=7){
      const ed=edadDe(a.nacim);
      out.push({tipo:'cump', a, orden:d,
        txt:`🎂 ${nombreCorto(a)} cumple ${ed===null?'':(ed+1)+' años'} ${d===0?'HOY':(d===1?'mañana':'en '+d+' días')}`});
    }
  });
  const deben=deudoresDelMes(mk);
  const vence=mk+'-'+String(D.config.diaVence||5).padStart(2,'0');
  deben.forEach(a=>{
    const dias=diasEntre(vence,hoy);              // + atrasado, − todavía no vence
    if(dias < -4) return;                          // falta mucho, no molesta
    const cola = dias>0 ? ' · '+dias+' días de atraso'
               : (dias===0 ? ' · VENCE HOY' : ' · vence en '+(-dias)+' días');
    out.push({tipo:'deu', a, orden:100-Math.min(99,dias),
      txt:`💵 ${nombreCorto(a)} debe ${money(debeDelMes(a,mk))}${cola}`});
  });
  alumnosActivos().forEach(a=>{
    if(becadoEn(a,mk) && ultimoMesBeca(a)===mk)
      out.push({tipo:'bec', a, orden:50, txt:`🎓 A ${nombreCorto(a)} se le acaba la beca este mes`});
  });
  alumnosActivos().forEach(a=>{
    if(!(a.waiver&&a.waiver.firmado) && diasEntre(a.desde||hoy,hoy)>14)
      out.push({tipo:'bec', a, orden:60, txt:`📄 ${nombreCorto(a)} todavía no ha firmado el permiso`});
  });
  return out.sort((x,y)=>x.orden-y.orden);
}
function avisosHTML(){
  const av=avisosDeHoy();
  if(!av.length) return '';
  const ver=av.slice(0,6);
  return `<div class="card"><div class="hd">🔔 Avisos de hoy (${av.length})</div>
    ${ver.map(x=>`<button class="aviso ${x.tipo}" style="width:100%;text-align:left"
      onclick="abrirAlumno('${x.a.id}')">${esc(x.txt)}</button>`).join('')}
    ${av.length>6?`<div class="mini">…y ${av.length-6} más.</div>`:''}</div>`;
}

     <canvas id="fi-canvas" class="firmacanvas"></canvas></div>
   <div class="dosc">
     <button class="btn chico" onclick="borrarFirma()">↺ Borrar</button>
     <button class="btn chico pri" onclick="guardarFirma('${a.id}')">✓ Guardar firma</button>
   </div>`);
  setTimeout(()=>prepararCanvas(),120);
}
function prepararCanvas(){
  const c=$('fi-canvas'); if(!c) return;
  const r=c.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  c.width=Math.round(r.width*dpr); c.height=Math.round(160*dpr);
  c.style.height='160px';
  const x=c.getContext('2d');
  x.scale(dpr,dpr); x.lineWidth=2.4; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#f3f5f6';
  FIRMA_CTX=x; FIRMA_HAY=false;
  let pintando=false;
  const pos=e=>{ const b=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e;
    return {x:t.clientX-b.left, y:t.clientY-b.top}; };
  const empieza=e=>{ e.preventDefault(); pintando=true; const p=pos(e); x.beginPath(); x.moveTo(p.x,p.y); };
  const mueve=e=>{ if(!pintando) return; e.preventDefault(); const p=pos(e); x.lineTo(p.x,p.y); x.stroke(); FIRMA_HAY=true; };
  const acaba=()=>{ pintando=false; };
  c.addEventListener('mousedown',empieza); c.addEventListener('mousemove',mueve);
  window.addEventListener('mouseup',acaba);
  c.addEventListener('touchstart',empieza,{passive:false});
  c.addEventListener('touchmove',mueve,{passive:false});
  c.addEventListener('touchend',acaba);
}
function borrarFirma(){
  const c=$('fi-canvas'); if(!c||!FIRMA_CTX) return;
  FIRMA_CTX.clearRect(0,0,c.width,c.height); FIRMA_HAY=false;
}
function guardarFirma(alumnoId){
  const a=porId(D.alumnos,alumnoId);
  const nom=($('fi-nombre').value||'').trim();
  if(!nom) return toast('Escribe el nombre de quien firma.');
  if(!$('fi-acepto').checked) return toast('Falta marcar que acepta los términos.');
  if(!FIRMA_HAY) return toast('Falta la firma. Dibújala con el dedo.');
  const c=$('fi-canvas');
  /* la firma se guarda con fondo, para que se vea al imprimirla en papel */
  const tmp=document.createElement('canvas'); tmp.width=c.width; tmp.height=c.height;
  const t=tmp.getContext('2d'); t.fillStyle='#ffffff'; t.fillRect(0,0,tmp.width,tmp.height);
  t.globalCompositeOperation='difference'; t.drawImage(c,0,0);
  const ahora=new Date();
  a.firma={nombre:nom, parentesco:($('fi-par')||{}).value||'', fecha:hoyISO(),
    hora:hora12(String(ahora.getHours()).padStart(2,'0')+':'+String(ahora.getMinutes()).padStart(2,'0')),
    trazo:tmp.toDataURL('image/png')};
  a.waiver={firmado:true, fecha:hoyISO()};
  log('Firmó el permiso de '+nombreAlumno(a)+' ('+nom+')');
  if(!guardar()) return;
  cerrarHoja(); toast('Permiso firmado'); pintar();
}

/* =========================== MOTOR DE INFORMES ===========================
   Un informe se describe UNA vez y sale en tres formatos:
   imprimir/PDF, Word (.docx) y Excel (.xlsx).
   Secciones: {t:'campos',tit,pares:[[k,v]]} · {t:'tabla',tit,cab:[],filas:[[]]}
              {t:'texto',tit,parrafos:[]} · {t:'firma',etiquetas:[]} · {t:'salto'}
========================================================================= */

/* ---------- ZIP sin librerías (guardado sin comprimir) ---------- */
const CRC_TABLA=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0;}
  return t;})();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_TABLA[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipGuardar(archivos){
  const cod=new TextEncoder(); const partes=[]; const central=[]; let off=0;
  const u16=v=>[v&255,(v>>8)&255];
  const u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
  archivos.forEach(f=>{
    const nom=cod.encode(f.nombre);
    const dat=typeof f.datos==='string'? cod.encode(f.datos) : f.datos;
    const c=crc32(dat);
    const loc=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(c),...u32(dat.length),...u32(dat.length),...u16(nom.length),...u16(0)];
    partes.push(new Uint8Array(loc), nom, dat);
    central.push({nom,c,len:dat.length,off});
    off += loc.length + nom.length + dat.length;
  });
  const cenIni=off; const cen=[];
  central.forEach(x=>{
    const h=[...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(x.c),...u32(x.len),...u32(x.len),...u16(x.nom.length),
      ...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(x.off)];
    cen.push(new Uint8Array(h), x.nom); off += h.length + x.nom.length;
  });
  const fin=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(central.length),...u16(central.length),...u32(off-cenIni),...u32(cenIni),...u16(0)]);
  return new Blob([...partes,...cen,fin],{type:'application/octet-stream'});
}
function bajarBlob(blob,nombre){
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=u; a.download=nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
const xml=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
function limpiaNombre(s){ return String(s||'documento').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,'_').slice(0,70); }

/* ---------- WORD (.docx) ---------- */
function parrafoW(txt,op){
  op=op||{};
  const r=`<w:rPr>${op.negrita?'<w:b/>':''}${op.tam?`<w:sz w:val="${Math.round(op.tam*2)}"/>`:''}${op.color?`<w:color w:val="${op.color}"/>`:''}</w:rPr>`;
  const p=`<w:pPr>${op.centro?'<w:jc w:val="center"/>':''}${op.sombra?'<w:shd w:val="clear" w:fill="F0ECE6"/>':''}${op.espacio?`<w:spacing w:before="${op.espacio}"/>`:''}</w:pPr>`;
  return `<w:p>${p}<w:r>${r}<w:t xml:space="preserve">${xml(txt)}</w:t></w:r></w:p>`;
}
function tablaW(cab,filas){
  const anchoTot=9360, cols=Math.max(1,(cab&&cab.length)||(filas[0]||[]).length);
  const w=Math.floor(anchoTot/cols);
  const celda=(t,neg,fondo)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${fondo?`<w:shd w:val="clear" w:fill="${fondo}"/>`:''}</w:tcPr>`+
    `<w:p><w:r><w:rPr>${neg?'<w:b/>':''}<w:sz w:val="22"/></w:rPr><w:t xml:space="preserve">${xml(t)}</w:t></w:r></w:p></w:tc>`;
  let h=`<w:tbl><w:tblPr><w:tblW w:w="${anchoTot}" w:type="dxa"/><w:tblBorders>`+
    ['top','left','bottom','right','insideH','insideV'].map(b=>`<w:${b} w:val="single" w:sz="4" w:color="AAAAAA"/>`).join('')+
    `</w:tblBorders></w:tblPr>`;
  if(cab&&cab.length) h+=`<w:tr>${cab.map(c=>celda(c,true,'F0ECE6')).join('')}</w:tr>`;
  filas.forEach(f=>{ h+=`<w:tr>${f.map(c=>celda(c,false,'')).join('')}</w:tr>`; });
  return h+`</w:tbl>`;
}
function informeAWord(inf){
  let c='';
  c+=parrafoW(nombreEscuela(),{negrita:true,tam:17,centro:true,color:'8A1C14'});
  c+=parrafoW(inf.titulo,{negrita:true,tam:15,centro:true});
  if(inf.subtitulo) c+=parrafoW(inf.subtitulo,{centro:true,tam:11,color:'666666'});
  c+=parrafoW('',{});
  (inf.secciones||[]).forEach(s=>{
    if(s.t==='salto'){ c+=`<w:p><w:r><w:br w:type="page"/></w:r></w:p>`; return; }
    if(s.tit) c+=parrafoW(s.tit,{negrita:true,tam:13.5,sombra:true,espacio:180});

  });

<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>

  return zipGuardar([
    {nombre:'[Content_Types].xml',datos:tipos},

}

    if(s.t==='campos') (s.pares||[]).forEach(([k,v])=>filas.push([{v:k,e:'cab'},{v:v==null?'':v}]));
    if(s.t==='tabla'){
      if(s.cab&&s.cab.length) filas.push(s.cab.map(c=>({v:c,e:'cab'})));
      (s.filas||[]).forEach(f=>filas.push(f.map(c=>({v:c==null?'':c}))));
    }
    if(s.t==='texto') (s.parrafos||[]).forEach(p=>filas.push([{v:p}]));

  const col=n=>{let s='';n++;while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;};

                   : `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xml(c.v)}</t></is></c>`;

<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="4"><font><sz val="12"/><name val="Calibri"/></font>
<font><b/><sz val="16"/><color rgb="FF8A1C14"/><name val="Calibri"/></font>
<font><b/><sz val="14"/><name val="Calibri"/></font>
<font><b/><sz val="12.5"/><name val="Calibri"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FFF0ECE6"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>

<cellXfs count="4"><xf xfId="0" fontId="0" fillId="0" borderId="0"/>
<xf xfId="0" fontId="1" fillId="0" borderId="0" applyFont="1"/>
<xf xfId="0" fontId="2" fillId="2" borderId="0" applyFont="1" applyFill="1"/>
<xf xfId="0" fontId="3" fillId="2" borderId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;
  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="Hoja1" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const wbrels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;
  const tipos=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`;

/* ---------- IMPRIMIR / PDF ---------- */
function informeAHTML(inf){
  let h=encabezadoDoc(inf.titulo, inf.subtitulo||'');
  if(inf.foto) h=h.replace('</div>\n    <h2','</div>\n    <h2');
  (inf.secciones||[]).forEach(s=>{
    if(s.t==='salto'){ h+='<div class="nueva"></div>'; return; }
    if(s.tit) h+=`<h2>${esc(s.tit)}</h2>`;
    if(s.t==='campos') h+=`<table>${(s.pares||[]).map(([k,v])=>
      `<tr><th>${esc(k)}</th><td>${v==null||v===''?'&nbsp;':esc(String(v))}</td></tr>`).join('')}</table>`;
    if(s.t==='tabla') h+=`<table>${s.cab&&s.cab.length?`<tr>${s.cab.map(c=>`<th style="width:auto">${esc(c)}</th>`).join('')}</tr>`:''}
      ${(s.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${c==null||c===''?'&nbsp;':esc(String(c))}</td>`).join('')}</tr>`).join('')}</table>`;
    if(s.t==='texto') (s.parrafos||[]).forEach(p=>{ h+=`<div class="tx">${esc(p)}</div>`; });
    if(s.t==='foto' && s.datos) h+=`<div style="text-align:center;margin:6px 0"><img src="${s.datos}" style="width:120px;height:120px;object-fit:cover;border:1px solid #999;border-radius:6px"></div>`;
    if(s.t==='firmaimg' && s.datos) h+=`<div class="firma"><img class="firmaimg" src="${s.datos}">
      <div style="text-align:center;font-size:9.5pt">${esc(s.pie||'')}</div></div>`;
    if(s.t==='firma') h+=`<div class="firma"><div class="lineas">${(s.etiquetas||['Firma','Nombre','Fecha'])
      .map(e=>`<div class="linea">${esc(e)}</div>`).join('')}</div></div>`;
  });
  return h;
}

/* =========================== LOS INFORMES DEL DOJO =========================== */
const VACIO='';
function siNo(v){ return v?'Sí':'No'; }
function dirTexto(o){ return direccionDe(o).replace(' · ', ', '); }

/* ---------- 1. EXPEDIENTE COMPLETO DEL ALUMNO ---------- */
function infExpediente(a){
  const c=a?cintDe(a):null, e=a?elegibilidad(a):null;
  const menor=a?esMenor(a):true;
  const pagos=a?D.pagos.filter(p=>p.alumnoId===a.id).sort((x,y)=>String(x.fecha).localeCompare(y.fecha)):[];
  const hist=a?(a.historial||[]).slice().sort((x,y)=>String(x.fecha).localeCompare(y.fecha)):[];
  const tec=(c&&c.tecnicas||[]);
  const S=[];
  if(a&&a.foto) S.push({t:'foto',datos:a.foto});
  S.push({t:'campos',tit:'Datos personales',pares:[
    ['Nombre completo', a?nombreAlumno(a):VACIO],
    ['Fecha de nacimiento', a&&a.nacim?fechaLarga(a.nacim):VACIO],
    ['Edad', a&&edadDe(a.nacim)!==null?edadDe(a.nacim)+' años ('+(menor?'menor de edad':'adulto')+')':VACIO],
    ['Teléfono', a?a.tel:VACIO],
    ['Correo', a?a.correo:VACIO],
    ['Dirección', a?dirTexto(a):VACIO],
  ]});
  S.push({t:'campos',tit:'En el dojo',pares:[
    ['Grupo', a?nombreGrupo(a.grupoId):VACIO],
    ['Días que toma clase', a?(a.dias||[]).map(i=>DIAS[i]).join(', '):VACIO],
    ['Se inscribió el', a&&a.desde?fechaLarga(a.desde):VACIO],
    ['Estado', a?({activo:'Activo',pausa:'En pausa',baja:'Se dio de baja'}[a.estadoAl||'activo']):VACIO],
    ['Talla de uniforme', a?a.talla:VACIO],
    ['Grado actual', c?nombreGrado(c):VACIO],
    ['Clases en total', a?totalClases(a.id):VACIO],
    ['Con este grado', e?e.clases+' clases · '+e.meses+' meses':VACIO],
    ['Última vez que vino', a&&ultimaClase(a.id)?fechaLarga(ultimaClase(a.id)):VACIO],
  ]});
  const perPersona=(t,p)=>({t:'campos',tit:t,pares:[
    ['Nombre', p?nombrePersona(p):VACIO],
    ['Parentesco', p?p.parentesco:VACIO],
    ['Teléfono', p?p.tel:VACIO],
    ['Correo', p?p.correo:VACIO],
    ['Dirección', p?dirTexto(p):VACIO],
  ]});
  if(menor){ S.push(perPersona('Madre', a?a.madre:null)); S.push(perPersona('Padre', a?a.padre:null)); }
  S.push(perPersona('Contacto de emergencia', a?a.emerg:null));
  S.push({t:'campos',tit:'Salud y permisos',pares:[
    ['Alergias o condiciones médicas', a?(a.medico||'Ninguna reportada'):VACIO],
    ['Quién puede recogerlo', a?a.recogen:VACIO],
    ['Permiso de fotos y redes', a?siNo(a.permisoFotos):VACIO],
    ['Permiso de participación firmado', a?(a.waiver&&a.waiver.firmado?'Sí · '+fechaLarga(a.waiver.fecha):'NO'):VACIO],
  ]});
  if(a&&a.firma&&a.firma.trazo)
    S.push({t:'firmaimg',datos:a.firma.trazo,
      pie:a.firma.nombre+(a.firma.parentesco?' · '+a.firma.parentesco:'')+' · '+fechaLarga(a.firma.fecha)});
  S.push({t:'salto'});
  S.push({t:'campos',tit:'Dinero',pares:[
    ['Inscripción', a&&a.inscMonto!==''&&a.inscMonto!==undefined?money(a.inscMonto):VACIO],
    ['La inscripción incluye uniforme', a?siNo(a.inscUniforme!==false):VACIO],
    ['Inscripción pagada el', a&&a.inscFecha?fechaLarga(a.inscFecha):VACIO],
    ['Cada cuánto paga', a?etiquetaFrec(a):VACIO],
    ['Cuota base', a?money(a.cuota===''||a.cuota===undefined?D.config.cuota:a.cuota):VACIO],
    ['Descuento de familia', a&&porId(D.familias,a.familiaId)?(porId(D.familias,a.familiaId).descuento||0)+'%':'—'],
    ['Cuota cada vez (ya con descuento)', a?money(cuotaPorVez(a)):VACIO],
    ['Al mes', a?money(cuotaDe(a,mesActual())):VACIO],
    ['Familia', a&&porId(D.familias,a.familiaId)?porId(D.familias,a.familiaId).nombre:VACIO],
    ['Beca', a&&a.beca&&a.beca.activa?'Sí, hasta '+mesBonito(ultimoMesBeca(a)):'No'],
  ]});
  S.push({t:'tabla',tit:'Pagos',cab:['Fecha','Mes que paga','Monto','Cómo pagó','Nota'],
    filas: pagos.length? pagos.map(p=>[fCorta(p.fecha)+'/'+String(p.fecha).slice(0,4),
      mesBonito(p.mes), money(p.monto), p.metodo||'', p.nota||''])
      : [['','','','',''],['','','','',''],['','','','','']]});
  S.push({t:'tabla',tit:'Su camino en los cinturones',cab:['Fecha','Grado que sacó','Nota'],
    filas: hist.length? hist.map(x=>{const cc=porId(D.cinturones,x.cinturonId);
      return [fechaLarga(x.fecha), cc?nombreGrado(cc):'', x.nota||''];})
      : [['','',''],['','','']]});
  S.push({t:'tabla',tit:'Técnicas de su grado actual',cab:['Técnica','¿La tiene?'],
    filas: tec.length? tec.map(t=>[t.nombre, a&&(a.tecnicas||[]).includes(t.id)?'Sí':'—']) : [['','']]});
  S.push({t:'texto',tit:'Notas',parrafos:[a&&a.nota?a.nota:'____________________________________________________________']});
  S.push({t:'firma',etiquetas:['Firma del instructor','Nombre','Fecha']});
  return {titulo:'Expediente · '+(a?nombreAlumno(a):'EN BLANCO'),
    subtitulo:'Expediente completo del alumno · '+fechaLarga(hoyISO()), secciones:S};
}

/* ---------- 2. TODOS LOS EXPEDIENTES ---------- */
function infTodosExpedientes(){
  const S=[];
  alumnosActivos().forEach((a,i)=>{
    if(i) S.push({t:'salto'});
    const x=infExpediente(a);
    S.push({t:'texto',tit:nombreAlumno(a),parrafos:[]});
    x.secciones.forEach(s=>S.push(s));
  });
  return {titulo:'Todos los expedientes',
    subtitulo:alumnosActivos().length+' alumnos · '+fechaLarga(hoyISO()), secciones:S};
}

/* ---------- 3. DIRECTORIO ---------- */
function infDirectorio(){
  return {titulo:'Directorio de alumnos', subtitulo:fechaLarga(hoyISO()), secciones:[
    {t:'tabla',tit:'Alumnos activos',
     cab:['Alumno','Edad','Grado','Grupo','Tel. del alumno','A quién llamar','Tel.','Dirección'],
     filas: alumnosActivos().map(a=>{
       const q = esMenor(a) ? (a.madre&&a.madre.nom? nombrePersona(a.madre)
                   : (a.padre&&a.padre.nom? nombrePersona(a.padre) : (a.emerg?nombrePersona(a.emerg):'')))
                : (a.emerg?nombrePersona(a.emerg):'');
       return [nombreAlumno(a), edadDe(a.nacim)===null?'':edadDe(a.nacim),
         (cintDe(a)||{}).nombre||'', nombreGrupo(a.grupoId), a.tel||'—', q, telDeAviso(a), dirTexto(a)];})}]};
}

/* ---------- 4. CONTACTOS DE EMERGENCIA ---------- */
function infEmergencia(){
  return {titulo:'Contactos de emergencia', subtitulo:'Tener siempre a mano en el dojo', secciones:[
    {t:'tabla',tit:'A quién llamar',
     cab:['Alumno','Edad','Madre / Padre','Teléfono','Emergencia','Teléfono','Alergias / condiciones'],
     filas: alumnosActivos().map(a=>{
       const m=a.madre&&a.madre.nom? nombrePersona(a.madre) : (a.padre&&a.padre.nom? nombrePersona(a.padre):'');

         a.emerg?nombrePersona(a.emerg):'', a.emerg?a.emerg.tel:'', a.medico||'—'];})},
    {t:'texto',parrafos:['En caso de emergencia grave: llamar al 911 primero, después a la familia.']}]};
}

/* ---------- 5. ASISTENCIA ---------- */
function infAsistencia(mk){
  mk=mk||mesActual();
  const ses=D.asistencia.filter(s=>String(s.fecha).slice(0,7)===mk)
    .sort((a,b)=>String(a.fecha).localeCompare(b.fecha));
  const dias=[...new Set(ses.map(s=>s.fecha))];
  const cab=['Alumno',...dias.map(d=>fCorta(d)),'Total'];
  const filas=alumnosActivos().map(a=>{
    let n=0;
    const c=dias.map(d=>{ const vino=ses.some(s=>s.fecha===d&&(s.presentes||[]).includes(a.id));
      if(vino) n++; return vino?'X':''; });
    return [nombreAlumno(a),...c,n];
  });
  return {titulo:'Asistencia · '+mesBonito(mk), subtitulo:dias.length+' clases en el mes', secciones:[
    {t:'tabla',tit:'Quién vino a cada clase',cab, filas: filas.length?filas:[['—']]}]};
}
function infAsistenciaBlanco(){
  const cab=['Alumno',...Array.from({length:14},(_,i)=>'___')];
  return {titulo:'Hoja de asistencia en blanco', subtitulo:'Para pasar lista a mano en el dojo', secciones:[
    {t:'campos',tit:'Datos de la hoja',pares:[['Grupo',''],['Mes',''],['Instructor','']]},
    {t:'tabla',tit:'Marca con X quién vino',cab,
     filas: alumnosActivos().length? alumnosActivos().map(a=>[nombreAlumno(a),...Array(14).fill('')])
       : Array.from({length:25},()=>Array(15).fill(''))},
    {t:'firma',etiquetas:['Firma del instructor','Fecha']}]};
}

/* ---------- 6. CUOTAS ---------- */
function infCuotasMes(mk){
  mk=mk||mesActual();
  const filas=alumnosActivos().map(a=>{
    const toca=cuotaDe(a,mk), pag=pagadoDelMes(a.id,mk), debe=debeDelMes(a,mk);
    return [nombreAlumno(a), etiquetaFrec(a), money(cuotaPorVez(a)), money(toca), money(pag),
      debe>0?money(debe):'—', becadoEn(a,mk)?'Becado':(a.estadoAl==='pausa'?'En pausa':'')];
  });
  return {titulo:'Cuotas · '+mesBonito(mk), subtitulo:'Cobrado '+money(cobradoDelMes(mk))+
      ' de '+money(esperadoDelMes(mk)), secciones:[
    {t:'tabla',tit:'Mes por alumno',
     cab:['Alumno','Frecuencia','Cada vez','Le toca el mes','Pagó','Debe','Nota'], filas},
    {t:'campos',tit:'Resumen',pares:[
      ['Esperado del mes', money(esperadoDelMes(mk))],
      ['Cobrado', money(cobradoDelMes(mk))],
      ['Falta por cobrar', money(Math.max(0,esperadoDelMes(mk)-cobradoDelMes(mk)))],
      ['Alumnos que deben', deudoresDelMes(mk).length]]}]};
}
function infCuotasAnio(anio){
  anio=anio||new Date().getFullYear();
  const meses=Array.from({length:12},(_,i)=>anio+'-'+String(i+1).padStart(2,'0'));
  const filas=alumnosActivos().map(a=>[nombreAlumno(a),
    ...meses.map(mk=>{ const d=debeDelMes(a,mk); const p=pagadoDelMes(a.id,mk);
      return p>0? money(p) : (d>0?'debe':'—'); })]);
  const tot=meses.map(mk=>money(cobradoDelMes(mk)));

const ETAPAS=[['interesado','Interesado','#3f5a6b'],['prueba','Clase de prueba','#8a6a1f'],
              ['inscrito','Se inscribió','#1f6b4a'],['perdido','No siguió','#5a3a35']];
function prospectos(){ D.prospectos=D.prospectos||[]; return D.prospectos; }
function etapaDe(v){ return ETAPAS.find(e=>e[0]===v)||ETAPAS[0]; }
function diasDesde(iso){ return iso? diasEntre(iso,hoyISO()) : null; }

PINTORES.prospectos=()=>{
  const P=prospectos();
  const cuenta=v=>P.filter(p=>p.estado===v).length;
  const abiertos=P.filter(p=>p.estado==='interesado'||p.estado==='prueba')

  const conv = (cuenta('inscrito')+cuenta('perdido'))
    ? Math.round(cuenta('inscrito')/(cuenta('inscrito')+cuenta('perdido'))*100) : 0;
  $('v-prospectos').innerHTML=`

    <div class="mini">Gente que preguntó o vino a probar. Aquí es donde nacen los alumnos nuevos.</div>
    <div class="embudo">${ETAPAS.map(([v,t,c])=>`<div class="paso" style="border-color:${c}">
      <div class="num">${cuenta(v)}</div><div class="et">${t}</div></div>`).join('')}</div>
    <div class="fila"><span class="gris">De los que se decidieron, se quedaron</span>
      <span class="mono ${conv>=50?'verde':'ambar'}"><b>${conv}%</b></span></div>
    <button class="btn pri" style="margin-top:9px" onclick="editarProspecto()">➕ Agregar prospecto</button>
  </div>

    ${abiertos.length? abiertos.map(p=>filaProspecto(p)).join('')
      :'<div class="vacio-msj">Nadie en proceso ahora mismo.</div>'}
  </div>
  ${cerrados.length?`<div class="card"><div class="hd">Ya se decidieron (${cerrados.length})</div>

    onclick="editarProspecto('${p.id}')">
    <div class="izq"><div class="n1">${esc(p.nombre||'(sin nombre)')}
      ${frio?'<span class="chip r">se está enfriando</span>':''}</div>
      <div class="n2"><span class="chip" style="background:${e[2]};color:#fff">${e[1]}</span>
        ${p.tel?' · '+esc(p.tel):''}${d!==null?' · hace '+d+' día'+(d===1?'':'s'):''}</div>
      ${p.nota?`<div class="mini">${esc(p.nota)}</div>`:''}</div>
    <span class="fl gris">›</span></button>`;
}
function editarProspecto(id){
  const P=prospectos();

     ${selectorHTML('pr-como',p.comoLlego||'',['Pasó por el frente','Lo recomendó un alumno','Facebook',
       'Instagram','Google','Volante','Un familiar del dojo','Otro'],'Escoge…')}</div>
   <div class="campo"><label>En qué va</label>
     <select id="pr-estado">${ETAPAS.map(([v,t])=>`<option value="${v}"${v===p.estado?' selected':''}>${t}</option>`).join('')}</select></div>
   <div class="dosc">
     <div class="campo"><label>Primer contacto</label><input type="date" id="pr-fecha" value="${p.fecha||hoyISO()}"></div>

   </div>

   ${p.tel?`<button class="btn" style="margin-top:8px" onclick="mensajePara({nombre:${JSON.stringify(p.nombre||'')},tel:${JSON.stringify(p.tel)}},'prospecto')">💬 Escribirle por WhatsApp</button>`:''}
   <button class="btn pri" style="margin-top:10px" onclick="guardarProspecto('${id||''}')">Guardar</button>
   ${id?`<button class="btn" style="margin-top:8px" onclick="pasarAAlumno('${id}')">🥋 Convertirlo en alumno</button>
     <button class="btn peligro" style="margin-top:8px" onclick="borrarProspecto('${id}')">🗑️ Borrar</button>`:''}`);

function guardarProspecto(id){
  limpiarMarcas();
  if(avisarFaltan(faltantes([['pr-nom','Nombre']]))) return;
  const o={nombre:$('pr-nom').value.trim(), tel:$('pr-tel').value.trim(),
    edad:$('pr-edad').value.trim(), correo:$('pr-correo').value.trim(),
    comoLlego:($('pr-como')||{}).value||'', estado:$('pr-estado').value,
    fecha:$('pr-fecha').value||hoyISO(), fechaPrueba:$('pr-prueba').value||'',
    nota:$('pr-nota').value.trim()};
  const P=prospectos();
  if(id){ Object.assign(P.find(x=>x.id===id),o); log('Modificó al prospecto '+o.nombre); }
  else { P.push({id:uid(),...o}); log('Agregó al prospecto '+o.nombre); }
  if(!guardar()) return;
  sonOK(); cerrarHoja(); toast('Guardado'); ir('prospectos');
}
function borrarProspecto(id){
  const p=prospectos().find(x=>x.id===id);
  confirmarBorrar('¿Borrar a '+(p.nombre||'este prospecto')+'?',[],()=>{
    D.prospectos=prospectos().filter(x=>x.id!==id);
    log('Borró al prospecto '+p.nombre); guardar(); cerrarHoja(); toast('Borrado'); ir('prospectos');
  });
}
function pasarAAlumno(id){
  const p=prospectos().find(x=>x.id===id);
  p.estado='inscrito'; guardar();
  cerrarHoja(); sonOK();
  toast('Ahora llena su ficha');
  setTimeout(()=>{ editarAlumno();
    setTimeout(()=>{ if($('al-nom')){ const par=(p.nombre||'').trim().split(/\s+/);
      $('al-nom').value=par[0]||''; if(par[1]) $('al-ape').value=par[1];
      if($('al-tel')) $('al-tel').value=p.tel||''; if($('al-correo')) $('al-correo').value=p.correo||''; } },150);
  },200);
}

/* ═══════════════ 2 · KIOSCO DE ENTRADA ═══════════════ */
let KIOSCO_GRUPO='';
function abrirKiosco(){
  KIOSCO_GRUPO=(D.grupos[0]||{}).id||'';
  document.body.classList.add('en-kiosco');
  pintarKiosco();
}
async function salirKiosco(){
  const c=prompt('Clave del maestro para salir del kiosco:');
  if(c===null) return;
  if(await hash(c,D.clave.sal)!==D.clave.h){ sonError(); alert('Clave incorrecta.'); return; }
  document.body.classList.remove('en-kiosco');
  $('kiosco').innerHTML=''; pintar();
}
function pintarKiosco(){
  const g=porId(D.grupos,KIOSCO_GRUPO);
  const hoy=hoyISO();
  const ses=D.asistencia.find(s=>s.fecha===hoy && s.grupoId===KIOSCO_GRUPO);
  const marcados=(ses&&ses.presentes)||[];
  const als=alumnosDeGrupo(KIOSCO_GRUPO).filter(a=>a.estadoAl!=='baja');
  $('kiosco').innerHTML=`
   <div class="k-top">
     <div class="k-tit">${esc(nombreEscuela())}</div>
     <div class="k-sub">${esc(g?g.nombre:'')} · ${fLarga(hoy)} · <b>${marcados.length}</b> de ${als.length}</div>
     <div class="k-grupos">${D.grupos.filter(x=>x.activo!==false).map(x=>
       `<button class="btn chico ${x.id===KIOSCO_GRUPO?'pri':''}" style="width:auto"
         onclick="KIOSCO_GRUPO='${x.id}';pintarKiosco()">${esc(x.nombre)}</button>`).join('')}</div>
   </div>
   <div class="k-rejilla">
     ${als.length? als.map(a=>{ const si=marcados.includes(a.id);
       return `<button class="k-cara${si?' si':''}" onclick="kioscoTocar('${a.id}')">
         <div class="k-foto" style="${a.foto?`background-image:url(${a.foto})`:''}">${a.foto?'':CARA_VACIA}</div>
         <div class="k-nom">${esc(nombreCorto(a))}</div>
         ${si?'<div class="k-ok">✓ presente</div>':''}</button>`;}).join('')
       :'<div class="vacio-msj">Este grupo no tiene alumnos.</div>'}
   </div>
   <button class="k-salir" onclick="salirKiosco()">🔒 Salir del kiosco</button>`;
}
function kioscoTocar(alumnoId){
  const hoy=hoyISO();
  let ses=D.asistencia.find(s=>s.fecha===hoy && s.grupoId===KIOSCO_GRUPO);
  if(!ses){ ses={id:uid(),grupoId:KIOSCO_GRUPO,fecha:hoy,presentes:[]}; D.asistencia.push(ses); }
  ses.presentes=ses.presentes||[];
  const i=ses.presentes.indexOf(alumnoId);
  if(i>=0){ ses.presentes.splice(i,1); sonError(); }
  else { ses.presentes.push(alumnoId); sonOK(); }
  guardar(); pintarKiosco();
}

function soloNumeros(t){ return String(t||'').replace(/\D/g,''); }
function linkWhats(tel,texto){
  let n=soloNumeros(tel);
  if(n.length===10) n='1'+n;              /* Estados Unidos */
  return 'https://wa.me/'+n+'?text='+encodeURIComponent(texto);
}
function plantillasPara(a,tipo){
  const dojo=nombreEscuela();
  const nom=nombreCorto(a)||a.nombre||'';
  const mk=mesActual();
  const debe=a.id?debeDelMes(a,mk):0;
  const L=[];
  if(tipo==='prospecto'){
    L.push(['Invitarlo a la clase de prueba',
      `Hola ${nom}, le saluda ${dojo}. Con mucho gusto lo esperamos para su clase de prueba, es gratis y sin compromiso. ¿Qué día le queda mejor?`]);
    L.push(['Recordarle la clase de prueba',
      `Hola ${nom}, le recuerdo su clase de prueba en ${dojo}. Traiga ropa cómoda, del uniforme nos encargamos después. ¡Lo esperamos!`]);
    L.push(['Seguimiento después de la prueba',
      `Hola ${nom}, ¿qué le pareció la clase? Si quiere seguir entrenando con nosotros, con gusto le explico los horarios y las cuotas.`]);
    return L;
  }
  if(debe>0) L.push(['Cuota pendiente',
    `Hola, le saluda ${dojo}. Le recuerdo que la cuota de ${nom} correspondiente a ${mesBonito(mk)} está pendiente: ${money(debe)}. Gracias.`]);
  const d=diasParaCumple(a.nacim);
  if(d!==null && d<=7) L.push(['Felicitación de cumpleaños',
    `¡Felicidades ${nom}! Todo el ${dojo} le desea un feliz cumpleaños. ¡Osu!`]);
  const u=ultimaClase(a.id), dd=u?diasEntre(u,hoyISO()):null;
  if(dd!==null && dd>=10) L.push(['Hace días que no viene',
    `Hola, le saluda ${dojo}. Notamos que ${nom} no ha venido a clases desde hace ${dd} días. ¿Está todo bien? Lo extrañamos en el tatami.`]);
  const e=a.id?elegibilidad(a):null;
  if(e&&e.listo) L.push(['Ya está listo para examen',
    `Hola, le saluda ${dojo}. ${nom} ya cumplió los requisitos para presentarse a examen de grado. Le aviso la fecha en cuanto la tengamos.`]);
  if(!(a.firma&&a.firma.trazo)) L.push(['Falta firmar el permiso',
    `Hola, le saluda ${dojo}. Nos falta el permiso de participación firmado de ${nom}. ¿Puede pasar unos minutos antes de la próxima clase para firmarlo?`]);
  L.push(['Recordatorio de clase',
    `Hola, le saluda ${dojo}. Le recuerdo que ${nom} tiene clase hoy. ¡Lo esperamos!`]);
  L.push(['Escribir yo el mensaje','']);
  return L;
}
