  --fondo:#2f3438; --tarjeta:#3b4147; --tarjeta2:#454c53; --tarjeta3:#484f56;
  --linea:#626b74; --texto:#f3f5f6; --texto2:#bcc4cb; --texto3:#b7c0c8;
  --rojo:#f2b3ae; --verde:#98d1a6; --ambar:#e4c26f; --plata:#c3cbd2; --salio:#f0baba;
  --r:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--fondo);color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:66px}
.num{font-variant-numeric:tabular-nums;letter-spacing:.2px}
.verde{color:var(--verde)} .ambar{color:var(--ambar)} .gris{color:var(--texto2)}
.rojo{color:var(--rojo)}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;background:var(--tarjeta3);color:var(--texto);
  border:1px solid var(--linea);border-radius:var(--r);padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--plata);outline-offset:-1px}
input::placeholder,textarea::placeholder{color:#c2cad1;opacity:1}
input[type=date],input[type=time],input[type=file]{color-scheme:dark}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--texto2) 50%),linear-gradient(135deg,var(--texto2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:28px}

#barra{position:sticky;top:0;z-index:40;background:#383e43;border-bottom:1px solid var(--linea);
  display:flex;align-items:center;gap:8px;padding:9px 11px}
#barra .marca{font-size:12.5px;font-weight:700;letter-spacing:1.1px;color:var(--rojo);
  text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icobtn{background:var(--tarjeta2);border:1px solid var(--linea);border-radius:var(--r);padding:6px 10px;font-size:16px;line-height:1}

.wrap{max-width:660px;margin:0 auto;padding:11px}
.vista{display:none} .vista.on{display:block}

.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);padding:11px;margin-bottom:9px}
.card.tight{padding:9px}
.hd{font-size:11.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--texto3);margin-bottom:8px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:6px 0}
.fila+.fila{border-top:1px solid var(--linea)}
.fila .izq{min-width:0;flex:1}
.fila .n1{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .n2{font-size:12px;color:var(--texto3);margin-top:2px}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--linea);margin-top:8px;padding-top:8px}
.total b{font-size:20px;font-weight:600}
.big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}

.btn{display:block;width:100%;background:var(--tarjeta2);border:1px solid var(--linea);
  border-radius:var(--r);padding:11px;text-align:center;font-weight:600;color:var(--texto);font-size:15px}
.btn:active{background:var(--tarjeta3)}
.btn.pri{background:var(--plata);color:#25292c;border-color:var(--plata)}
.btn.pri:active{background:#dde3e8}
.btn.rojo{background:#4e2c29;border-color:var(--rojo);color:var(--rojo)}
.btn.chico{padding:7px 11px;width:auto;display:inline-block;font-size:13.5px;font-weight:500}
.btn.peligro{color:var(--salio)}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rejilla .btn{text-align:left;padding:12px 11px;font-weight:500}
.rejilla .btn .e{display:block;font-size:19px;margin-bottom:3px}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campo{margin-bottom:10px}
.campo label{display:block;font-size:12px;color:var(--texto3);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.5px;font-weight:600}

/* ---- rejilla de caras para pasar lista ---- */
.caras{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:9px}
.cara{position:relative;background:var(--tarjeta2);border:2px solid var(--linea);border-radius:var(--r);
  padding:8px 4px 9px;text-align:center;overflow:hidden}
.cara.pres{border-color:var(--verde);background:#33503c}
.cara .foto{width:62px;height:62px;border-radius:50%;margin:0 auto 5px;background:var(--tarjeta3);
  background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--texto3);border:1px solid var(--linea)}
.cara .nom{font-size:13.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cara .cint{margin-top:3px;display:flex;align-items:center;justify-content:center;gap:3px}
.cara .tick{position:absolute;top:3px;right:5px;font-size:14px}
.pto{width:5px;height:5px;border-radius:50%;background:var(--texto2);display:inline-block}
.cinta{display:inline-block;width:26px;height:9px;border-radius:2px;border:1px solid rgba(255,255,255,.45);vertical-align:middle}
.cinta.sm{width:18px;height:7px}

/* ---- foto en fichas ---- */
.avatar{width:64px;height:64px;border-radius:50%;background:var(--tarjeta3);background-size:cover;
  background-position:center;border:2px solid var(--linea);display:flex;align-items:center;
  justify-content:center;font-size:24px;color:var(--texto3);flex:none}
.avatar.sm{width:40px;height:40px;font-size:16px;border-width:1px}

.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.pill{background:var(--tarjeta2);border:1px solid var(--linea);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--texto2)}
.pill.sel{background:var(--plata);color:#25292c;border-color:var(--plata);font-weight:600}
.chip{display:inline-block;background:var(--tarjeta3);border-radius:4px;padding:1px 7px;font-size:11px;
  color:var(--texto2);margin-left:5px;vertical-align:middle}
.chip.v{background:#33503c;color:var(--verde)} .chip.a{background:#514630;color:var(--ambar)}
.chip.r{background:#4e2c29;color:var(--rojo)}

.nota{background:var(--tarjeta2);border-left:3px solid var(--plata);border-radius:0 var(--r) var(--r) 0;
  padding:9px 11px;font-size:13px;color:var(--texto2);margin-bottom:9px}
.nota.al{border-left-color:var(--ambar);color:#e8d3a2}
.nota.ok{border-left-color:var(--verde);color:#b6d9c0}
.nota.err{border-left-color:var(--salio);color:#e5bcbc}
.vacio-msj{text-align:center;color:var(--texto3);padding:28px 12px;font-size:13.5px}
.barra-b{height:8px;background:var(--tarjeta3);border-radius:4px;overflow:hidden;margin-top:5px}
.barra-b i{display:block;height:100%;background:var(--plata);border-radius:4px}
.barra-b.v i{background:var(--verde)} .barra-b.a i{background:var(--ambar)}
.sep{height:1px;background:var(--linea);margin:10px 0}
.mini{font-size:12px;color:var(--texto3)}

#abajo button.on{color:var(--plata);border-top-color:var(--plata)}

.capa{position:fixed;inset:0;z-index:60;background:rgba(16,18,20,.74);display:none;align-items:flex-end;justify-content:center}

.hoja{background:var(--tarjeta);width:100%;max-width:660px;max-height:88vh;overflow-y:auto;

.hoja-tit h3{font-size:15px;letter-spacing:.3px}
.op{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 4px;

.op:active{background:var(--tarjeta2)}
.op .fl{color:var(--texto3);font-size:12px}
.grupo-tit{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--texto3);

#pantalla-login{position:fixed;inset:0;z-index:90;background:var(--fondo);display:flex;

#pantalla-login .marca{font-size:15px;font-weight:700;letter-spacing:2px;color:var(--rojo);
  text-transform:uppercase;line-height:1.5}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--texto3);
  text-align:center;padding:5px 4px;border-bottom:1px solid var(--linea);font-weight:700}
table.t th:first-child{text-align:left}
table.t td{padding:6px 4px;border-bottom:1px solid var(--linea);text-align:center;font-variant-numeric:tabular-nums}
table.t td:first-child{text-align:left}
table.t tr:last-child td{border-bottom:none}
.puntaje{display:flex;gap:6px}
.puntaje button{flex:1;padding:9px 0;border:1px solid var(--linea);border-radius:var(--r);
  background:var(--tarjeta2);font-weight:600;font-size:15px}
.puntaje button.sel{background:var(--plata);color:#25292c;border-color:var(--plata)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(14px);
  background:var(--tarjeta3);border:1px solid var(--linea);color:var(--texto);padding:10px 16px;
  border-radius:20px;font-size:13.5px;z-index:95;opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foto-prev{max-width:100%;border-radius:var(--r);border:1px solid var(--linea);margin-top:7px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#pantalla-login .sello,#barra .marca i{background:var(--logo) center/contain no-repeat}
#barra .marca i{width:19px;height:19px;display:inline-block;vertical-align:-4px;margin-right:6px}
</style>
</head>

</div>
</div>

<div class="capa" id="capa"><div class="hoja" id="hoja"></div></div>
<div id="toast"></div>

<script>
/* =======================================================================
   OKAMURA DOJO USA KARATE ACADEMY · v1.0
   Todo se guarda en este aparato. Nada sale a internet.
   ======================================================================= */
'use strict';
const LLAVE='dojo_okamura_v1';
const VERSION_APP='20260801a-DOJO-V1.0';

/* ---------- cinturones de fábrica (se pueden cambiar todos) ---------- */
const CINTURONES_FABRICA=[
 ['Blanco',   '#f2f2f2', 20, 3, 2],
 ['Amarillo', '#e8c74a', 24, 3, 3],
 ['Naranja',  '#e08a44', 28, 4, 3],
 ['Verde',    '#5fa96b', 32, 4, 3],
 ['Azul',     '#4f7fbf', 36, 6, 3],
 ['Morado',   '#8a6bb0', 40, 6, 3],
 ['Marrón',   '#8a6242', 48, 8, 3],
 ['Negro',    '#2a2a2a', 60,12, 0],
];
const TECNICAS_FABRICA={
 'Blanco':['Seiza y rei','Zenkutsu dachi','Oi tsuki','Gedan barai','Mae geri','Kihon en línea'],
 'Amarillo':['Kokutsu dachi','Age uke','Soto uke','Gyaku tsuki','Yoko geri keage','Mawashi geri','Taikyoku Shodan','Kumite básico 1'],
 'Naranja':['Kiba dachi','Uchi uke','Shuto uke','Empi uchi','Yoko geri kekomi','Heian Shodan','Kumite básico 2','Rompimiento de agarre'],
};

/* ---------- helpers ---------- */
let D=null, tostTmr=null;
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2=v=>(Math.round((Number(v)||0)*100)/100);
const money=v=>{const x=n2(v);return (x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
const norm=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const anioDe=iso=>Number(String(iso||'').slice(0,4))||0;
const mesDe=iso=>Number(String(iso||'').slice(5,7))||0;
const MESES=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['','ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIA3=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
function fLarga(iso){if(!iso)return '';const[a,m,d]=String(iso).split('-');return `${Number(d)} ${MES3[Number(m)]} ${a}`;}
function fCorta(iso){if(!iso)return '';const[,m,d]=String(iso).split('-');return `${Number(m)}/${Number(d)}`;}
function diasEntre(a,b){ if(!a||!b) return 0;
  return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000); }
function mesesEntre(a,b){ if(!a||!b) return 0;
  const x=new Date(a+'T12:00:00'), y=new Date(b+'T12:00:00');
  return (y.getFullYear()-x.getFullYear())*12 + (y.getMonth()-x.getMonth()) - (y.getDate()<x.getDate()?1:0); }
function hora12(h){ if(!h) return ''; const [H,M]=h.split(':').map(Number);
  const ap=H>=12?'PM':'AM'; const h12=H%12===0?12:H%12; return `${h12}:${String(M).padStart(2,'0')} ${ap}`; }
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tostTmr);
  tostTmr=setTimeout(()=>e.classList.remove('on'),2600);}
const porId=(arr,id)=>(arr||[]).find(x=>x.id===id)||null;
const mesClave=iso=>String(iso||'').slice(0,7);
const mesActual=()=>hoyISO().slice(0,7);
function mesBonito(mk){ if(!mk) return ''; const [a,m]=mk.split('-'); return MESES[Number(m)]+' '+a; }

/* ---------- guardar / cargar ---------- */
function datosNuevos(){
  const cints=CINTURONES_FABRICA.map((c,i)=>({id:uid(),nombre:c[0],color:c[1],orden:i,
    clases:c[2],meses:c[3],rayas:c[4],
    tecnicas:(TECNICAS_FABRICA[c[0]]||[]).map(t=>({id:uid(),nombre:t}))}));
  return {
    v:1, creado:new Date().toISOString(), clave:null,
    escuela:{nombre:'OKAMURA DOJO USA KARATE ACADEMY'},
    grupos:[
      {id:uid(),nombre:'Grupo 1',desde:'18:00',hasta:'19:00',dias:[2,4],activo:true},
      {id:uid(),nombre:'Grupo 2',desde:'19:00',hasta:'20:00',dias:[2,4],activo:true}
    ],
    cinturones:cints, alumnos:[], familias:[], asistencia:[], pagos:[], examenes:[],
    bitacora:[],
    config:{cuota:90, diaVence:5, huella:null, huellaBorrar:true, moneda:'$'}
  };
}
function guardar(){
  try{ localStorage.setItem(LLAVE,JSON.stringify(D)); return true; }
  catch(e){
    alert('⚠️ NO SE PUDO GUARDAR\n\nEl aparato no aceptó los datos ('+e.name+').\n\nBaja un backup AHORA desde el menú antes de seguir.\n\nSi pasa seguido, suele ser por muchas fotos: quítale la foto a algunos alumnos que ya no estén.');
    return false;
  }
}
function log(t){ D.bitacora.push({f:new Date().toISOString(),t}); if(D.bitacora.length>4000) D.bitacora=D.bitacora.slice(-4000); }
function cargar(){
  const s=localStorage.getItem(LLAVE);
  if(!s) return null;
  try{
    const d=JSON.parse(s); if(!d||!d.v) return null;
    d.config=d.config||{};
    if(d.config.huella===undefined) d.config.huella=null;
    if(d.config.huellaBorrar===undefined) d.config.huellaBorrar=true;
    ['grupos','cinturones','alumnos','familias','asistencia','pagos','examenes','bitacora']
      .forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
    d.cinturones.forEach(c=>{ if(!Array.isArray(c.tecnicas)) c.tecnicas=[]; });
    d.alumnos.forEach(a=>{
      if(!Array.isArray(a.historial)) a.historial=[];
      if(!Array.isArray(a.tecnicas))  a.tecnicas=[];
      if(a.rayas===undefined) a.rayas=0;
      if(a.activo===undefined) a.activo=true;
    });
    return d;
  }catch(e){ return null; }
}

/* ---------- clave ---------- */
async function hash(clave,sal){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey('raw',enc.encode(clave),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(sal),iterations:150000,hash:'SHA-256'},k,256);
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function msjLogin(t){const e=$('login-msj');if(!t){e.style.display='none';return;}e.textContent=t;e.style.display='block';}
async function crearClave(){
  const a=$('cl1').value,b=$('cl2').value;
  if(a.length<4) return msjLogin('La clave necesita al menos 4 caracteres.');
  if(a!==b) return msjLogin('Las dos claves no son iguales.');
  D=datosNuevos();
  const sal=uid()+uid();
  D.clave={sal,h:await hash(a,sal)};
  log('Se creó la clave de la app');
  if(!guardar()) return;
  abrirApp();
}
async function entrar(){
  const c=$('cl0').value;
  if(!c) return msjLogin('Escribe tu clave.');
  if(await hash(c,D.clave.sal)!==D.clave.h) return msjLogin('Clave incorrecta.');
  msjLogin(''); abrirApp();
}
function abrirApp(){
  $('pantalla-login').style.display='none';
  $('app-contenido').style.display='block';
  ir('inicio');
}

/* ---------- huella ---------- */
function hayHuella(){ return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
async function huellaDisponible(){
  if(!hayHuella()) return false;
  try{ if(PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){}
  return false;
}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const deB64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');const b=atob(s);
  const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;};
const azar=n=>crypto.getRandomValues(new Uint8Array(n));
async function registrarHuella(){
  if(!await huellaDisponible())
    return alert('Este aparato no ofrece lector de huella al navegador.\n\nEn el teléfono suele funcionar; en una PC de escritorio muchas veces no.');
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:azar(32), rp:{name:'Okamura Dojo'},
      user:{id:azar(16),name:'sensei',displayName:'Sensei'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000, attestation:'none'}});
    if(!cred) return toast('No se registró la huella.');
    D.config.huella={activa:true,id:b64(cred.rawId)};
    log('Registró la huella en este aparato'); guardar(); toast('Huella registrada'); pintar();
  }catch(e){ alert('No se pudo registrar la huella ('+(e&&e.name||'error')+').'); }
}
function quitarHuella(){
  if(!confirm('¿Quitar la huella de este aparato?\n\nVas a seguir entrando con tu clave.')) return;
  D.config.huella=null; log('Quitó la huella'); guardar(); toast('Huella quitada'); pintar();
}
async function pedirHuella(){
  const h=D.config.huella; if(!h||!h.activa||!h.id) return false;
  try{ return !!await navigator.credentials.get({publicKey:{challenge:azar(32),timeout:60000,
    userVerification:'required',allowCredentials:[{type:'public-key',id:deB64(h.id)}]}}); }
  catch(e){ return false; }
}
async function confirmarDueno(motivo){
  if(!D.config.huellaBorrar || !D.config.huella || !D.config.huella.activa) return true;
  if(await pedirHuella()) return true;
  const c=prompt('Confirma con tu clave para:\n\n'+motivo);
  if(c===null) return false;
  if(await hash(c,D.clave.sal)===D.clave.h) return true;
  toast('Clave incorrecta.'); return false;
}
async function entrarConHuella(){
  if(!await pedirHuella()) return msjLogin('No se pudo leer la huella. Usa tu clave.');
  msjLogin(''); abrirApp();
}

/* ---------- navegación ---------- */
let vistaActual='inicio';
const PINTORES={};
function ir(v){
  vistaActual=v;
  document.querySelectorAll('.vista').forEach(e=>e.classList.remove('on'));
  const el=$('v-'+v); if(el) el.classList.add('on');
  document.querySelectorAll('#abajo button').forEach(b=>b.classList.toggle('on',b.dataset.ir===v));
  window.scrollTo(0,0); pintar();
}
function pintar(){ if(PINTORES[vistaActual]) PINTORES[vistaActual](); }

let cerrarCb=null;
function hoja(titulo,html,cb){
  $('hoja').innerHTML=`<div class="hoja-tit"><h3>${esc(titulo)}</h3>
    <button class="icobtn" onclick="cerrarHoja()">✕</button></div>${html}`;
  $('capa').classList.add('on'); cerrarCb=cb||null; $('hoja').scrollTop=0;
}
function cerrarHoja(){ $('capa').classList.remove('on'); $('hoja').innerHTML=''; const c=cerrarCb; cerrarCb=null; if(c)c(); }

/* ---------- cosas del dojo ---------- */
function cintDe(a){ return porId(D.cinturones,a&&a.cinturonId) || D.cinturones[0] || null; }
function cintaHTML(c,sm){ if(!c) return '';
  return `<span class="cinta${sm?' sm':''}" style="background:${esc(c.color)}" title="${esc(c.nombre)}"></span>`; }
function puntosHTML(n){ let h=''; for(let i=0;i<(n||0);i++) h+='<i class="pto"></i>'; return h; }
function siguienteCint(c){ if(!c) return null;
  const orden=D.cinturones.slice().sort((a,b)=>a.orden-b.orden);
  const i=orden.findIndex(x=>x.id===c.id);
  return (i>=0 && i<orden.length-1) ? orden[i+1] : null; }
function nombreAlumno(a){ return a? [a.nombre,a.apellido].filter(Boolean).join(' ') : ''; }
function nombreGrupo(id){ const g=porId(D.grupos,id); return g?g.nombre:''; }
function horarioGrupo(g){ return g? hora12(g.desde)+' – '+hora12(g.hasta) : ''; }
function alumnosActivos(){ return D.alumnos.filter(a=>a.activo!==false); }
function alumnosDeGrupo(gid){ return alumnosActivos().filter(a=>a.grupoId===gid); }

/* clases a las que vino un alumno desde una fecha */
function clasesDesde(alumnoId,desdeISO){
  let n=0;
  D.asistencia.forEach(s=>{
    if(desdeISO && s.fecha < desdeISO) return;
    if((s.presentes||[]).includes(alumnoId)) n++;
  });
  return n;
}
function totalClases(alumnoId){ return clasesDesde(alumnoId,null); }
function ultimaClase(alumnoId){
  let u=null;
  D.asistencia.forEach(s=>{ if((s.presentes||[]).includes(alumnoId)) { if(!u||s.fecha>u) u=s.fecha; } });
  return u;
}
/* desde cuándo tiene el cinturón actual */
function desdeCinturon(a){
  if(a.historial && a.historial.length){
    const ult=a.historial.slice().sort((x,y)=>x.fecha.localeCompare(y.fecha)).slice(-1)[0];
    if(ult && ult.fecha) return ult.fecha;
  }
  return a.desde||a.creado||hoyISO();
}
/* ¿puede examinarse? */
function elegibilidad(a){
  const c=cintDe(a), sig=siguienteCint(c);
  const d0=desdeCinturon(a), hoy=hoyISO();
  const clases=clasesDesde(a.id,d0);
  const meses=mesesEntre(d0,hoy);
  const tot=(c&&c.tecnicas||[]).length;
  const hechas=(c&&c.tecnicas||[]).filter(t=>(a.tecnicas||[]).includes(t.id)).length;
  const faltanClases=Math.max(0,(c&&c.clases||0)-clases);
  const faltanMeses=Math.max(0,(c&&c.meses||0)-meses);
  const faltanTec=Math.max(0,tot-hechas);
  return {c,sig,clases,meses,tot,hechas,faltanClases,faltanMeses,faltanTec,
    listo: !sig? false : (faltanClases===0 && faltanMeses===0 && faltanTec===0),
    casi: !sig? false : (faltanClases+faltanMeses+faltanTec)>0 && (faltanClases<=4 && faltanMeses<=1 && faltanTec<=2)};
}

/* ---------- arranque ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  D=cargar();
  if(D && D.clave){ $('login-entrar').style.display='block'; setTimeout(()=>$('cl0').focus(),250);
    if(D.config && D.config.huella && D.config.huella.activa)
      huellaDisponible().then(ok=>{ if(ok) $('login-huella').style.display='block'; });
  } else { $('login-nuevo').style.display='block'; }
  $('btn-crear-clave').onclick=crearClave;
  $('btn-entrar').onclick=entrar;
  $('btn-huella').onclick=entrarConHuella;
  $('cl0').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});
  $('cl2').addEventListener('keydown',e=>{if(e.key==='Enter')crearClave();});
  $('btn-menu').onclick=menu;
  document.querySelectorAll('#abajo button').forEach(b=>b.onclick=()=>ir(b.dataset.ir));
});

function menu(){
  const items=[
    ['🎓','Listos para examen','elegibles'],['📋','Exámenes','examenes'],
    ['🥋','Cinturones y técnicas','cinturones'],['🕕','Grupos y horarios','grupos'],
    ['👨‍👩‍👧','Familias','familias'],['📊','Cómo va el dojo','reportes'],
    ['💾','Backup y seguridad','backup'],['📖','Manual de uso','manual'],['📓','Bitácora','bitacora']
  ];
  hoja('Menú', items.map(i=>
    `<button class="op" onclick="cerrarHoja();ir('${i[2]}')"><span>${i[0]} ${esc(i[1])}</span><span class="fl">›</span></button>`
  ).join('')+`<div class="mini" style="margin-top:14px;text-align:center">Versión ${VERSION_APP}</div>`);
}
/* =========================== INICIO =========================== */
function grupoDeHoy(){
  const d=new Date().getDay();
  const gs=D.grupos.filter(g=>g.activo!==false && (g.dias||[]).includes(d));
  return gs.length?gs:D.grupos.filter(g=>g.activo!==false);
}
function seDespegan(){
  const hoy=hoyISO(), out=[];
  alumnosActivos().forEach(a=>{
    const u=ultimaClase(a.id);
    if(!u){ if(diasEntre(a.desde||hoy,hoy)>21) out.push({a,dias:diasEntre(a.desde,hoy),nunca:true}); return; }
    const d=diasEntre(u,hoy);
    if(d>=14) out.push({a,dias:d,nunca:false});
  });
  return out.sort((x,y)=>y.dias-x.dias);
}
PINTORES.inicio=()=>{
  const hoy=hoyISO(), mk=mesActual();
  const gs=grupoDeHoy();
  const pend=deudoresDelMes(mk);
  const desp=seDespegan();
  const eleg=alumnosActivos().map(a=>({a,e:elegibilidad(a)})).filter(x=>x.e.listo);
  let h='';
  if(!D.alumnos.length){
    h+=`<div class="card"><div class="hd">Primer paso</div>
      <div class="mini" style="margin-bottom:9px">Agrega tus alumnos. Después de eso, pasar lista te toma segundos.</div>
      <button class="btn pri" onclick="editarAlumno()">➕ Agregar mi primer alumno</button></div>`;
  }
  if(eleg.length) h+=`<div class="nota ok">🎓 <b>${eleg.length}</b> alumno${eleg.length>1?'s':''} listo${eleg.length>1?'s':''} para examen.
    <button class="btn chico" style="margin-top:7px" onclick="ir('elegibles')">Ver quiénes</button></div>`;
  if(pend.length) h+=`<div class="nota al">💵 <b>${pend.length}</b> deben la cuota de ${esc(mesBonito(mk))}.
    <button class="btn chico" style="margin-top:7px" onclick="ir('cuotas')">Ver quiénes</button></div>`;
  if(desp.length) h+=`<div class="nota al">⚠️ ${desp.slice(0,3).map(x=>esc(nombreAlumno(x.a))+' ('+x.dias+' días)').join(' · ')}${desp.length>3?' … y '+(desp.length-3)+' más':''} sin venir.
    <button class="btn chico" style="margin-top:7px" onclick="ir('reportes')">Ver todos</button></div>`;

  h+=`<div class="card"><div class="hd">🥋 Clases de hoy · ${DIAS[new Date().getDay()]}</div>`;
  if(!gs.length) h+='<div class="vacio-msj">No hay grupos configurados.</div>';
  gs.forEach(g=>{
    const n=alumnosDeGrupo(g.id).length;
    const ses=D.asistencia.find(s=>s.fecha===hoy&&s.grupoId===g.id);
    h+=`<button class="fila" style="width:100%;text-align:left" onclick="abrirLista('${g.id}')">
      <div class="izq"><div class="n1">${esc(g.nombre)}${ses?`<span class="chip v">lista pasada</span>`:''}</div>
      <div class="n2">${horarioGrupo(g)} · ${n} alumno${n===1?'':'s'}${ses?' · vinieron '+(ses.presentes||[]).length:''}</div></div>
      <span class="fl gris">›</span></button>`;
  });
  h+=`</div>`;

  const act=alumnosActivos().length;
  const cob=cobradoDelMes(mk), esp=esperadoDelMes(mk);
  h+=`<div class="card">
    <div class="hd">📊 ${esc(mesBonito(mk))}</div>
    <div class="fila"><span>Alumnos activos</span><span class="mono">${act}</span></div>
    <div class="fila"><span>Cobrado</span><span class="mono verde">${money(cob)}</span></div>
    <div class="fila"><span>Falta</span><span class="mono ${esp-cob>0?'ambar':'verde'}">${money(Math.max(0,esp-cob))}</span></div>
  </div>
  <div class="rejilla">
    <button class="btn" onclick="ir('lista')"><span class="e">✓</span>Pasar lista</button>
    <button class="btn" onclick="ir('alumnos')"><span class="e">👥</span>Alumnos</button>
    <button class="btn" onclick="ir('elegibles')"><span class="e">🎓</span>Listos para examen</button>
    <button class="btn" onclick="ir('cuotas')"><span class="e">💵</span>Cuotas</button>
    <button class="btn" onclick="ir('reportes')"><span class="e">📊</span>Cómo va el dojo</button>
    <button class="btn" onclick="ir('manual')"><span class="e">📖</span>Manual</button>
  </div>`;
  $('v-inicio').innerHTML=h;
};

/* =========================== PASAR LISTA =========================== */
let LISTA={grupoId:'',fecha:'',presentes:[]};
function abrirLista(gid){
  const g=porId(D.grupos,gid)||D.grupos[0];
  if(!g) return toast('Primero crea un grupo.');
  const f=hoyISO();
  const ses=D.asistencia.find(s=>s.fecha===f&&s.grupoId===g.id);
  LISTA={grupoId:g.id,fecha:f,presentes:ses?(ses.presentes||[]).slice():[]};
  ir('lista');
}
PINTORES.lista=()=>{
  if(!D.grupos.length){
    $('v-lista').innerHTML=`<div class="card"><div class="vacio-msj">Todavía no hay grupos.</div>
      <button class="btn pri" onclick="ir('grupos')">Crear un grupo</button></div>`; return;
  }
  if(!porId(D.grupos,LISTA.grupoId)){ LISTA.grupoId=D.grupos[0].id; LISTA.fecha=LISTA.fecha||hoyISO(); }
  const g=porId(D.grupos,LISTA.grupoId);
  const ses=D.asistencia.find(s=>s.fecha===LISTA.fecha&&s.grupoId===g.id);
  const als=alumnosDeGrupo(g.id).sort((a,b)=>nombreAlumno(a).localeCompare(nombreAlumno(b)));
  const pres=LISTA.presentes.length;
  $('v-lista').innerHTML=`
  <div class="card tight">
    <div class="dosc">
      <div class="campo" style="margin:0"><label>Grupo</label>
        <select onchange="cambiarGrupoLista(this.value)">
          ${D.grupos.map(x=>`<option value="${x.id}"${x.id===g.id?' selected':''}>${esc(x.nombre)}</option>`).join('')}
        </select></div>
      <div class="campo" style="margin:0"><label>Día</label>
        <input type="date" value="${LISTA.fecha}" onchange="cambiarFechaLista(this.value)"></div>
    </div>
    <div class="mini" style="margin-top:6px">${horarioGrupo(g)}${ses?' · ya pasaste lista este día':''}</div>
  </div>
  <div class="card">
    <div class="hd">${als.length} alumno${als.length===1?'':'s'} · presentes ${pres}</div>
    ${als.length?`<div class="caras">${als.map(a=>{
      const c=cintDe(a), on=LISTA.presentes.includes(a.id);
      return `<button class="cara ${on?'pres':''}" onclick="marcar('${a.id}')">
        ${on?'<span class="tick">✅</span>':''}
        <div class="foto" style="${a.foto?`background-image:url(${a.foto})`:''}">${a.foto?'':'👤'}</div>
        <div class="nom">${esc(a.nombre)}</div>
        <div class="cint">${cintaHTML(c,true)}${puntosHTML(a.rayas)}</div>
      </button>`;}).join('')}</div>`
      :'<div class="vacio-msj">Este grupo no tiene alumnos todavía.</div>'}
  </div>
  ${als.length?`<div class="dosc">
    <button class="btn" onclick="marcarTodos(true)">Marcar todos</button>
    <button class="btn" onclick="marcarTodos(false)">Quitar todos</button>
  </div>
  <button class="btn pri" style="margin-top:8px" onclick="guardarLista()">
    ${ses?'GUARDAR CAMBIOS':'GUARDAR LA LISTA'} · ${pres} de ${als.length}</button>`:''}
  ${ses?`<button class="btn peligro" style="margin-top:8px" onclick="borrarLista()">🗑️ Borrar la lista de este día</button>`:''}`;
};
function cambiarGrupoLista(gid){
  LISTA.grupoId=gid;
  const s=D.asistencia.find(x=>x.fecha===LISTA.fecha&&x.grupoId===gid);
  LISTA.presentes=s?(s.presentes||[]).slice():[];
  PINTORES.lista();
}
function cambiarFechaLista(f){
  if(!f) return;
  LISTA.fecha=f;
  const s=D.asistencia.find(x=>x.fecha===f&&x.grupoId===LISTA.grupoId);
  LISTA.presentes=s?(s.presentes||[]).slice():[];
  PINTORES.lista();
}
function marcar(id){
  const i=LISTA.presentes.indexOf(id);
  if(i>=0) LISTA.presentes.splice(i,1); else LISTA.presentes.push(id);
  PINTORES.lista();
}
function marcarTodos(si){
  LISTA.presentes = si? alumnosDeGrupo(LISTA.grupoId).map(a=>a.id) : [];
  PINTORES.lista();
}
function guardarLista(){
  const g=porId(D.grupos,LISTA.grupoId);
  let s=D.asistencia.find(x=>x.fecha===LISTA.fecha&&x.grupoId===LISTA.grupoId);
  if(s){ s.presentes=LISTA.presentes.slice(); log('Cambió la lista de '+g.nombre+' del '+LISTA.fecha); }
  else { D.asistencia.push({id:uid(),fecha:LISTA.fecha,grupoId:LISTA.grupoId,presentes:LISTA.presentes.slice()});
    log('Pasó lista de '+g.nombre+' el '+LISTA.fecha+': '+LISTA.presentes.length+' presentes'); }
  guardar(); toast('Lista guardada'); pintar();
}
async function borrarLista(){
  const s=D.asistencia.find(x=>x.fecha===LISTA.fecha&&x.grupoId===LISTA.grupoId);
  if(!s) return;
  if(!confirm('¿Borrar la lista de este día?')) return;
  if(!await confirmarDueno('borrar la lista del '+fLarga(LISTA.fecha))) return;
  D.asistencia=D.asistencia.filter(x=>x.id!==s.id);
  LISTA.presentes=[]; log('Borró la lista del '+LISTA.fecha);
  guardar(); toast('Borrada'); pintar();
}

/* =========================== ALUMNOS =========================== */
let FA={q:'',grupo:'',ver:'activos'};
PINTORES.alumnos=()=>{
  let als=D.alumnos.slice();
  if(FA.ver==='activos') als=als.filter(a=>a.activo!==false);
  if(FA.ver==='inactivos') als=als.filter(a=>a.activo===false);
  if(FA.grupo) als=als.filter(a=>a.grupoId===FA.grupo);
  if(FA.q){ const n=norm(FA.q);
    als=als.filter(a=>norm([nombreAlumno(a),a.tutor1n,a.tutor1t,a.tutor2n,(cintDe(a)||{}).nombre].join(' ')).includes(n)); }
  als.sort((a,b)=>nombreAlumno(a).localeCompare(nombreAlumno(b)));
  $('v-alumnos').innerHTML=`
  <input type="text" placeholder="Buscar alumno o encargado…" value="${esc(FA.q)}"
    oninput="FA.q=this.value;PINTORES.alumnos()" style="margin-bottom:9px">
  <div class="pills">
    <button class="pill ${!FA.grupo?'sel':''}" onclick="FA.grupo='';PINTORES.alumnos()">Todos</button>
    ${D.grupos.map(g=>`<button class="pill ${FA.grupo===g.id?'sel':''}" onclick="FA.grupo='${g.id}';PINTORES.alumnos()">${esc(g.nombre)}</button>`).join('')}
  </div>
  <div class="pills">
    ${[['activos','Activos'],['inactivos','Se fueron'],['todos','Todos']].map(v=>
      `<button class="pill ${FA.ver===v[0]?'sel':''}" onclick="FA.ver='${v[0]}';PINTORES.alumnos()">${v[1]}</button>`).join('')}
  </div>
  <div class="card">
    <div class="hd">${als.length} alumno${als.length===1?'':'s'}</div>
    ${als.length?als.map(a=>{
      const c=cintDe(a), deuda=debeDelMes(a,mesActual());
      return `<button class="fila" style="width:100%;text-align:left" onclick="abrirAlumno('${a.id}')">
        <div class="avatar sm" style="${a.foto?`background-image:url(${a.foto})`:''}">${a.foto?'':'👤'}</div>
        <div class="izq"><div class="n1">${esc(nombreAlumno(a))}${a.activo===false?'<span class="chip">se fue</span>':''}${deuda>0?'<span class="chip a">debe</span>':''}</div>
        <div class="n2">${cintaHTML(c,true)} ${esc(c?c.nombre:'')} ${puntosHTML(a.rayas)} · ${esc(nombreGrupo(a.grupoId))}</div></div>
        <span class="fl gris">›</span></button>`;}).join('')
      :'<div class="vacio-msj">Nadie con ese filtro.</div>'}
  </div>
  <button class="btn pri" onclick="editarAlumno()">➕ Agregar alumno</button>`;
};

  <div class="card">
    <div style="display:flex;gap:12px;align-items:center">

  </div>`:''}

  <div class="card">

    <div class="fila"><span>Clases en total</span><span class="mono">${tot}</span></div>

function asistenciaReciente(alumnoId,n){
  const a=porId(D.alumnos,alumnoId); if(!a) return {vino:0,total:0};
  const ses=D.asistencia.filter(s=>s.grupoId===a.grupoId).sort((x,y)=>y.fecha.localeCompare(x.fecha)).slice(0,n);
  return {vino:ses.filter(s=>(s.presentes||[]).includes(alumnoId)).length, total:ses.length};
}
function editarAlumno(id){

    tutor1n:'',tutor1t:'',tutor2n:'',tutor2t:'',familiaId:'',activo:true,nacim:''};
  const cints=D.cinturones.slice().sort((x,y)=>x.orden-y.orden);
  hoja(id?'Modificar alumno':'Agregar alumno',`
   <div class="dosc">
     <div class="campo"><label>Nombre</label><input id="al-nom" value="${esc(a.nombre)}"></div>
     <div class="campo"><label>Apellido</label><input id="al-ape" value="${esc(a.apellido||'')}"></div>
   </div>
   <div class="dosc">
     <div class="campo"><label>Grupo</label><select id="al-grupo">
       ${D.grupos.map(g=>`<option value="${g.id}"${g.id===a.grupoId?' selected':''}>${esc(g.nombre)} · ${horarioGrupo(g)}</option>`).join('')}
     </select></div>
     <div class="campo"><label>Empezó el</label><input type="date" id="al-desde" value="${a.desde||hoyISO()}"></div>
   </div>
   <div class="dosc">
     <div class="campo"><label>Cinturón</label><select id="al-cint">

let FOTO_TMP='';
function fotoBorrador(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  comprimirFoto(f,d=>{ FOTO_TMP=d; const p=$('al-foto-prev'); if(p) p.innerHTML=`<img src="${d}" class="foto-prev">`; });
}
function comprimirFoto(file,cb){
  const fr=new FileReader();
  fr.onload=e=>{ const img=new Image();
    img.onload=()=>{
      const max=380, s=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*s), h=Math.round(img.height*s);
      const lado=Math.min(w,h);
      const cv=document.createElement('canvas'); cv.width=lado; cv.height=lado;
      const cx=cv.getContext('2d');
      cx.drawImage(img,(w-lado)/2/s,(h-lado)/2/s,lado/s,lado/s,0,0,lado,lado);
      cb(cv.toDataURL('image/jpeg',0.62));
    };
    img.src=e.target.result; };
  fr.readAsDataURL(file);
}
function tomarFotoAlumno(id){

    comprimirFoto(f,d=>{ const a=porId(D.alumnos,id); a.foto=d;
      log('Le puso foto a '+nombreAlumno(a)); guardar(); toast('Foto guardada'); pintar(); }); };

function cuotaDe(a){
  let base = (a.cuota===''||a.cuota===undefined||a.cuota===null) ? n2(D.config.cuota) : n2(a.cuota);
  const f=porId(D.familias,a.familiaId);
  if(f && Number(f.descuento)>0) base = n2(base*(1-Number(f.descuento)/100));
  return base;
}
function pagadoDelMes(alumnoId,mk){
  return n2(D.pagos.filter(p=>p.alumnoId===alumnoId && p.mes===mk).reduce((s,p)=>s+n2(p.monto),0));
}
function debeDelMes(a,mk){
  if(a.activo===false) return 0;
  if(a.desde && mesClave(a.desde) > mk) return 0;
  return n2(Math.max(0, cuotaDe(a)-pagadoDelMes(a.id,mk)));
}
function deudoresDelMes(mk){
  return alumnosActivos().filter(a=>debeDelMes(a,mk)>0)
    .sort((x,y)=>debeDelMes(y,mk)-debeDelMes(x,mk));
}
function esperadoDelMes(mk){
  return n2(alumnosActivos().filter(a=>!(a.desde&&mesClave(a.desde)>mk)).reduce((s,a)=>s+cuotaDe(a),0));
}
function cobradoDelMes(mk){ return n2(D.pagos.filter(p=>p.mes===mk).reduce((s,p)=>s+n2(p.monto),0)); }

function puntuar(exId,i,k,v){
  const x=porId(D.examenes,exId); if(x.cerrado) return toast('Este examen ya está terminado.');
  x.alumnos[i][k]=v; guardar(); PINTORES.examen();
}
function notaExamen(exId,i,v){ const x=porId(D.examenes,exId); x.alumnos[i].nota=v; guardar(); }
function decidir(exId,i,paso){
  const x=porId(D.examenes,exId); if(x.cerrado) return toast('Este examen ya está terminado.');
  x.alumnos[i].paso = x.alumnos[i].paso===paso ? null : paso;
  guardar(); PINTORES.examen();
}
async function cerrarExamen(exId){
  const x=porId(D.examenes,exId);
  const sin=(x.alumnos||[]).filter(a=>a.paso===null).length;
  if(sin && !confirm('Todavía hay '+sin+' alumno(s) sin decidir.\n\n¿Terminar de todos modos? A esos no les pasa nada.')) return;
  if(!await confirmarDueno('terminar el examen y promover a los que pasaron')) return;
  let n=0;
  (x.alumnos||[]).forEach(al=>{
    if(al.paso!==true) return;
    const a=porId(D.alumnos,al.alumnoId); if(!a||!al.aId) return;
    a.historial=a.historial||[];
    a.historial.push({cinturonId:al.aId, fecha:x.fecha,
      nota:CRITERIOS.map(k=>k+' '+(al[k]||'-')).join(' · ')+(al.nota?' · '+al.nota:'')});
    a.cinturonId=al.aId; a.rayas=0; a.tecnicas=[];
    n++;
  });
  x.cerrado=true;
  log('Terminó el examen "'+x.nombre+'": '+n+' promovidos');
  guardar(); toast(n+' promovidos'); pintar();
}
async function borrarExamen(exId){
  const x=porId(D.examenes,exId);
  if(!confirm('¿Borrar el examen "'+x.nombre+'"?\n\nLas promociones que ya se hicieron NO se deshacen.')) return;
  if(!await confirmarDueno('borrar el examen '+x.nombre)) return;
  D.examenes=D.examenes.filter(e=>e.id!==exId); log('Borró el examen "'+x.nombre+'"');
  guardar(); toast('Borrado'); ir('examenes');
}
function promoverAlumno(id){
  const a=porId(D.alumnos,id), c=cintDe(a), sig=siguienteCint(c);
  if(!sig) return toast('Ya está en el último cinturón.');
  hoja('Promover a '+nombreAlumno(a),`
   <div class="nota">${cintaHTML(c,true)} ${esc(c.nombre)} → ${cintaHTML(sig,true)} <b>${esc(sig.nombre)}</b></div>
   <div class="campo"><label>Fecha del examen</label><input type="date" id="pr-fecha" value="${hoyISO()}"></div>
   <div class="campo"><label>Nota</label><input id="pr-nota" placeholder="opcional"></div>
   <button class="btn pri" onclick="confirmarPromocion('${id}')">Promover</button>`);
}
function confirmarPromocion(id){
  const a=porId(D.alumnos,id), c=cintDe(a), sig=siguienteCint(c);
  a.historial=a.historial||[];
  a.historial.push({cinturonId:sig.id,fecha:$('pr-fecha').value||hoyISO(),nota:($('pr-nota').value||'').trim()});
  a.cinturonId=sig.id; a.rayas=0; a.tecnicas=[];
  log('Promovió a '+nombreAlumno(a)+' a '+sig.nombre);
  guardar(); cerrarHoja(); toast('Promovido a '+sig.nombre); pintar();
}

  ses.forEach(s=>{ sumaP+=(s.presentes||[]).length; sumaE+=alumnosDeGrupo(s.grupoId).length; });

      <div class="avatar sm" style="${x.a.foto?`background-image:url(${x.a.foto})`:''}">${x.a.foto?'':'👤'}</div>
      <div class="izq"><div class="n1">${esc(nombreAlumno(x.a))}</div>
      <div class="n2">${x.nunca?'nunca ha venido':'no viene hace '+x.dias+' días'}${(x.a.tutor1t)?' · '+esc(x.a.tutor1t):''}</div></div>
      ${x.a.tutor1t?`<a class="btn chico" href="tel:${esc(x.a.tutor1t)}" onclick="event.stopPropagation()">📞</a>`:'<span class="fl gris">›</span>'}
      </button>`).join('')

    ${meses.map(x=>`<tr><td class="gris">${MES3[x.m]}</td>
      <td class="verde">${x.cob?money(x.cob):'–'}</td>
      <td>${x.esp?money(x.esp):'–'}</td>
      <td class="${x.esp-x.cob>0?'ambar':''}">${x.esp-x.cob>0?money(x.esp-x.cob):'–'}</td></tr>`).join('')}
    <tr><td><b>TOTAL</b></td><td><b class="verde">${money(totCob)}</b></td><td></td><td></td></tr>
    </tbody></table>
  </div>

  <div class="card">
    <div class="hd">⏰ Los que más se atrasan</div>
    ${tarde.length?tarde.map(x=>`<button class="fila" style="width:100%;text-align:left" onclick="abrirAlumno('${x.a.id}')">
      <div class="izq"><div class="n1">${esc(nombreAlumno(x.a))}</div>
      <div class="n2">${x.n} mes${x.n===1?'':'es'} sin pagar completo</div></div>
      <span class="fl gris">›</span></button>`).join('')
      :'<div class="nota ok">✅ Nadie se atrasa.</div>'}
  </div>
  <button class="btn" onclick="compartirResumen()">📤 Compartir el resumen</button>`;
};
function textoResumen(){
  const mk=mesActual(), act=alumnosActivos();
  let t=(D.escuela&&D.escuela.nombre||'DOJO')+'\n';
  t+='Resumen de '+mesBonito(mk)+'\n'+'='.repeat(40)+'\n\n';
  t+='Alumnos activos ........ '+act.length+'\n';
  D.grupos.forEach(g=>t+='  '+g.nombre+' ('+horarioGrupo(g)+') ... '+alumnosDeGrupo(g.id).length+'\n');
  t+='\nCobrado ................ '+money(cobradoDelMes(mk))+'\n';
  t+='Esperado ............... '+money(esperadoDelMes(mk))+'\n';
  t+='Falta .................. '+money(Math.max(0,esperadoDelMes(mk)-cobradoDelMes(mk)))+'\n';
  const deben=deudoresDelMes(mk);
  if(deben.length){ t+='\nDEBEN ('+deben.length+'):\n';
    deben.forEach(a=>t+='  '+nombreAlumno(a)+' — '+money(debeDelMes(a,mk))+'\n'); }
  const listos=act.map(a=>({a,e:elegibilidad(a)})).filter(x=>x.e.listo);
  if(listos.length){ t+='\nLISTOS PARA EXAMEN ('+listos.length+'):\n';
    listos.forEach(x=>t+='  '+nombreAlumno(x.a)+' — '+(x.e.c?x.e.c.nombre:'')+' → '+(x.e.sig?x.e.sig.nombre:'')+'\n'); }
  const desp=seDespegan();
  if(desp.length){ t+='\nNO ESTÁN VINIENDO ('+desp.length+'):\n';
    desp.forEach(x=>t+='  '+nombreAlumno(x.a)+' — '+(x.nunca?'nunca':x.dias+' días')+'\n'); }
  return t;
}
async function compartirResumen(){
  const t=textoResumen();
  try{ if(navigator.share){ await navigator.share({title:'Resumen del dojo',text:t}); return; } }catch(e){}
  hoja('Resumen',
    `<textarea readonly style="height:56vh;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px">${esc(t)}</textarea>
     <button class="btn pri" style="margin-top:9px" onclick="copiarTexto(this)">Copiar todo</button>`);
}
function copiarTexto(btn){
  const ta=btn.parentElement.querySelector('textarea');
  ta.select(); try{document.execCommand('copy');toast('Copiado');}catch(e){toast('Selecciónalo y cópialo a mano');}
}
function bajar(txt,nombre,tipo){
  const b=new Blob([txt],{type:tipo||'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=nombre; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u);},900);
}

    <div class="campo"><input type="password" id="sg-nueva" placeholder="Clave nueva"></div>
    <button class="btn" onclick="cambiarClave()">Cambiar clave</button>
  </div>
  <div class="nota al">⚠️ Aquí hay fotos, nombres y teléfonos de <b>menores de edad</b>.
    Nada de esto sale de tu aparato. Guarda el backup en un sitio seguro y no lo compartas con nadie.</div>`;
  pintarHuella();
};
async function pintarHuella(){
  const c=$('seg-huella'); if(!c) return;
  const disp=await huellaDisponible(); const h=D.config.huella;
  if(!disp){ c.innerHTML=`<div class="nota al">Este aparato no ofrece lector de huella al navegador.
    En el teléfono normalmente sí. Tu clave siempre funciona.</div>`; return; }
  c.innerHTML = (h&&h.activa)
   ? `<div class="nota ok">👆 Huella registrada en este aparato.</div>
      <label class="mini" style="display:block;margin:9px 0">
        <input type="checkbox" ${D.config.huellaBorrar!==false?'checked':''} style="width:auto;margin-right:7px"
          onchange="D.config.huellaBorrar=this.checked;guardar();toast('Guardado')">
        Pedirme la huella antes de borrar cosas</label>
      <button class="btn peligro" onclick="quitarHuella()">Quitar la huella de este aparato</button>`
   : `<div class="mini" style="margin-bottom:9px">Entra con tu huella en vez de escribir la clave. Se registra por aparato.</div>
      <button class="btn pri" onclick="registrarHuella()">👆 Registrar mi huella</button>`;
}
function bajarBackup(){
  const f=new Date(), s=f.getFullYear()+String(f.getMonth()+1).padStart(2,'0')+String(f.getDate()).padStart(2,'0');
  bajar(JSON.stringify(D),`backup_okamura_dojo_${s}.json`,'application/json');
  log('Bajó un backup'); guardar(); toast('Backup bajado');
}
async function restaurarBackup(){
  if(!await confirmarDueno('restaurar un backup encima de todo')) return;
  const f=$('bk-file').files[0]; if(!f) return toast('Escoge primero el archivo del backup.');
  const fr=new FileReader();
  fr.onload=e=>{
    let d; try{ d=JSON.parse(e.target.result); }catch(err){ return alert('Ese archivo no se puede leer.'); }
    if(!d||!d.v||!Array.isArray(d.alumnos)) return alert('Ese archivo no parece un backup de esta app.');
    if(!confirm(`¿Restaurar?\n\nEl backup trae ${d.alumnos.length} alumnos.\nSe reemplaza TODO lo que hay ahora.`)) return;
    const clave=D.clave; D=d; if(!D.clave) D.clave=clave;
    log('Restauró un backup con '+d.alumnos.length+' alumnos');
    guardar(); toast('Restaurado'); ir('inicio');
  };
  fr.readAsText(f);
}
async function cambiarClave(){
  const v=$('sg-vieja').value, n=$('sg-nueva').value;
  if(!v||!n) return toast('Llena las dos casillas.');
  if(n.length<4) return toast('La clave nueva necesita al menos 4 caracteres.');
  if(await hash(v,D.clave.sal)!==D.clave.h) return toast('La clave actual no es correcta.');
  const sal=uid()+uid(); D.clave={sal,h:await hash(n,sal)};
  log('Cambió la clave'); guardar(); toast('Clave cambiada');
  $('sg-vieja').value=''; $('sg-nueva').value='';
}
