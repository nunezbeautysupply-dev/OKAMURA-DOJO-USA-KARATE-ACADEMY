*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--fondo);color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:66px}
.num{font-variant-numeric:tabular-nums;letter-spacing:.2px}
.verde{color:var(--verde)} .ambar{color:var(--ambar)} .gris{color:var(--texto2)}
.rojo{color:var(--rojo)}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;background:var(--tarjeta3);color:var(--texto);
  border:1px solid var(--linea);border-radius:var(--r);padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--plata);outline-offset:-1px}
input::placeholder,textarea::placeholder{color:#c2cad1;opacity:1}
input[type=date],input[type=time],input[type=file]{color-scheme:dark}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--texto2) 50%),linear-gradient(135deg,var(--texto2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:28px}

#barra{position:sticky;top:0;z-index:40;background:#383e43;border-bottom:1px solid var(--linea);
  display:flex;align-items:center;gap:8px;padding:9px 11px}
#barra .marca{font-size:12.5px;font-weight:700;letter-spacing:1.1px;color:var(--rojo);
  text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icobtn{background:var(--tarjeta2);border:1px solid var(--linea);border-radius:var(--r);padding:6px 10px;font-size:16px;line-height:1}

<script>
/* =======================================================================

   Todo se guarda en este aparato. Nada sale a internet.
   ======================================================================= */
'use strict';
const LLAVE='dojo_okamura_v1';
const VERSION_APP='20260803a-DOJO-V2.0';

/* ---------- cinturones de fábrica (se pueden cambiar todos) ---------- */
const COLOR_CINT={blanco:'#e9e6df',amarillo:'#cfae3c',naranja:'#c4682f',verde:'#3d7a4b',
 azul:'#37588f',morado:'#68477f',marron:'#5e412c',negro:'#1c1c1c'};
/* nombre, color base, color de la franja del medio (o ''), kyu, clases, meses */
const CINTURONES_FABRICA=[
 ['Cinturón blanco',            'blanco',  '',        '',        12, 2],
 ['Blanco · raya amarilla',     'blanco',  'amarillo','9no kyu', 12, 2],
 ['Cinturón amarillo',          'amarillo','',        '8vo kyu', 16, 3],
 ['Amarillo · raya naranja',    'amarillo','naranja', '',        16, 3],
 ['Cinturón naranja',           'naranja', '',        '7mo kyu', 20, 3],
 ['Naranja · raya verde',       'naranja', 'verde',   '',        20, 3],
 ['Cinturón verde',             'verde',   '',        '6to kyu', 24, 4],
 ['Verde · raya azul',          'verde',   'azul',    '',        24, 4],
 ['Cinturón azul',              'azul',    '',        '5to kyu', 28, 4],
 ['Azul · raya morada',         'azul',    'morado',  '',        28, 4],
 ['Cinturón morado',            'morado',  '',        '4to kyu', 32, 6],
 ['Morado · raya marrón',       'morado',  'marron',  '',        32, 6],
 ['Cinturón marrón · 3er kyu',  'marron',  '',        '3er kyu', 40, 6],
 ['Cinturón marrón · 2do kyu',  'marron',  '',        '2do kyu', 44, 8],
 ['Cinturón marrón · 1er kyu',  'marron',  '',        '1er kyu', 48, 10],
 ['Cinturón negro · Shodan',    'negro',   '',        '1er Dan', 60, 12],
 ['Cinturón negro · Nidan',     'negro',   '',        '2do Dan', 80, 24],
 ['Cinturón negro · Sandan',    'negro',   '',        '3er Dan', 90, 36],
 ['Cinturón negro · Yondan',    'negro',   '',        '4to Dan', 90, 48],
 ['Cinturón negro · Godan',     'negro',   '',        '5to Dan', 90, 60],
 ['Cinturón negro · Rokudan',   'negro',   '',        '6to Dan', 90, 72],
 ['Cinturón negro · Shichidan', 'negro',   '',        '7mo Dan', 90, 84],
];
const TECNICAS_FABRICA={
 'Cinturón blanco':['Seiza y rei','Zenkutsu dachi','Oi tsuki','Gedan barai','Mae geri','Kihon en línea'],
 'Cinturón amarillo':['Kokutsu dachi','Age uke','Soto uke','Gyaku tsuki','Yoko geri keage','Mawashi geri','Taikyoku Shodan','Kumite básico 1'],
 'Cinturón naranja':['Kiba dachi','Uchi uke','Shuto uke','Empi uchi','Yoko geri kekomi','Heian Shodan','Kumite básico 2','Rompimiento de agarre'],
};

/* ---------- helpers ---------- */
let D=null, tostTmr=null;
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2=v=>(Math.round((Number(v)||0)*100)/100);
const money=v=>{const x=n2(v);return (x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
const norm=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const anioDe=iso=>Number(String(iso||'').slice(0,4))||0;
const mesDe=iso=>Number(String(iso||'').slice(5,7))||0;
const MESES=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['','ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIA3=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
function fLarga(iso){if(!iso)return '';const[a,m,d]=String(iso).split('-');return `${Number(d)} ${MES3[Number(m)]} ${a}`;}
function fCorta(iso){if(!iso)return '';const[,m,d]=String(iso).split('-');return `${Number(m)}/${Number(d)}`;}
function diasEntre(a,b){ if(!a||!b) return 0;
  return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000); }
function mesesEntre(a,b){ if(!a||!b) return 0;
  const x=new Date(a+'T12:00:00'), y=new Date(b+'T12:00:00');
  return (y.getFullYear()-x.getFullYear())*12 + (y.getMonth()-x.getMonth()) - (y.getDate()<x.getDate()?1:0); }
function hora12(h){ if(!h) return ''; const [H,M]=h.split(':').map(Number);
  const ap=H>=12?'PM':'AM'; const h12=H%12===0?12:H%12; return `${h12}:${String(M).padStart(2,'0')} ${ap}`; }
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tostTmr);
  tostTmr=setTimeout(()=>e.classList.remove('on'),2600);}
const porId=(arr,id)=>(arr||[]).find(x=>x.id===id)||null;
const mesClave=iso=>String(iso||'').slice(0,7);
const mesActual=()=>hoyISO().slice(0,7);
function mesBonito(mk){ if(!mk) return ''; const [a,m]=mk.split('-'); return MESES[Number(m)]+' '+a; }

/* ---------- guardar / cargar ---------- */
function cinturonesDeFabrica(){
  return CINTURONES_FABRICA.map((c,i)=>({id:uid(),nombre:c[0],base:c[1],franja:c[2],kyu:c[3],
    color:COLOR_CINT[c[1]], orden:i, clases:c[4], meses:c[5], rayas:0,
    tecnicas:(TECNICAS_FABRICA[c[0]]||[]).map(t=>({id:uid(),nombre:t}))}));
}
/* pasa los datos viejos (8 cinturones) a la escalera nueva, sin perder alumnos */
function migrarCinturones(){
  if(!D || !D.cinturones) return false;
  if(D.cinturones.some(c=>c.base)) return false;          // ya estaba migrado
  const equiv={'Blanco':'Cinturón blanco','Amarillo':'Cinturón amarillo','Naranja':'Cinturón naranja',
    'Verde':'Cinturón verde','Azul':'Cinturón azul','Morado':'Cinturón morado',
    'Marrón':'Cinturón marrón · 3er kyu','Negro':'Cinturón negro · Shodan'};
  const viejos=D.cinturones.slice();
  const nuevos=cinturonesDeFabrica();
  const porNombre={}; nuevos.forEach(c=>porNombre[c.nombre]=c);
  const mapa={};
  viejos.forEach(v=>{ const n=porNombre[equiv[v.nombre]||v.nombre]; if(n) mapa[v.id]=n.id; });
  /* las técnicas que el maestro haya agregado a mano se conservan */
  viejos.forEach(v=>{ const n=porNombre[equiv[v.nombre]||v.nombre]; if(!n) return;
    (v.tecnicas||[]).forEach(t=>{ if(!n.tecnicas.some(x=>x.nombre===t.nombre)) n.tecnicas.push({id:t.id,nombre:t.nombre}); });
    if(v.clases) n.clases=v.clases; if(v.meses) n.meses=v.meses; });
  D.cinturones=nuevos;

/* ---------- clave ---------- */
async function hash(clave,sal){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey('raw',enc.encode(clave),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(sal),iterations:150000,hash:'SHA-256'},k,256);
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function msjLogin(t){const e=$('login-msj');if(!t){e.style.display='none';return;}e.textContent=t;e.style.display='block';}
async function crearClave(){
  const a=$('cl1').value,b=$('cl2').value;
  if(a.length<4) return msjLogin('La clave necesita al menos 4 caracteres.');
  if(a!==b) return msjLogin('Las dos claves no son iguales.');
  D=datosNuevos();
  const sal=uid()+uid();
  D.clave={sal,h:await hash(a,sal)};
  log('Se creó la clave de la app');
  if(!guardar()) return;
  abrirApp();
}
async function entrar(){
  const c=$('cl0').value;
  if(!c) return msjLogin('Escribe tu clave.');
  if(await hash(c,D.clave.sal)!==D.clave.h) return msjLogin('Clave incorrecta.');
  msjLogin(''); abrirApp();
}

/* ---------- huella ---------- */
function hayHuella(){ return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
async function huellaDisponible(){
  if(!hayHuella()) return false;
  try{ if(PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){}
  return false;
}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const deB64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');const b=atob(s);
  const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;};
const azar=n=>crypto.getRandomValues(new Uint8Array(n));
async function registrarHuella(){
  if(!await huellaDisponible())
    return alert('Este aparato no ofrece lector de huella al navegador.\n\nEn el teléfono suele funcionar; en una PC de escritorio muchas veces no.');
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:azar(32), rp:{name:'Okamura Dojo'},
      user:{id:azar(16),name:'sensei',displayName:'Sensei'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000, attestation:'none'}});
    if(!cred) return toast('No se registró la huella.');
    D.config.huella={activa:true,id:b64(cred.rawId)};
    log('Registró la huella en este aparato'); guardar(); toast('Huella registrada'); pintar();
  }catch(e){ alert('No se pudo registrar la huella ('+(e&&e.name||'error')+').'); }
}
function quitarHuella(){
  if(!confirm('¿Quitar la huella de este aparato?\n\nVas a seguir entrando con tu clave.')) return;
  D.config.huella=null; log('Quitó la huella'); guardar(); toast('Huella quitada'); pintar();
}
async function pedirHuella(){
  const h=D.config.huella; if(!h||!h.activa||!h.id) return false;
  try{ return !!await navigator.credentials.get({publicKey:{challenge:azar(32),timeout:60000,
    userVerification:'required',allowCredentials:[{type:'public-key',id:deB64(h.id)}]}}); }
  catch(e){ return false; }
}
async function confirmarDueno(motivo){
  if(!D.config.huellaBorrar || !D.config.huella || !D.config.huella.activa) return true;
  if(await pedirHuella()) return true;
  const c=prompt('Confirma con tu clave para:\n\n'+motivo);
  if(c===null) return false;
  if(await hash(c,D.clave.sal)===D.clave.h) return true;
  toast('Clave incorrecta.'); return false;
}
async function entrarConHuella(){

  msjLogin(''); abrirApp();
}

/* clases a las que vino un alumno desde una fecha */
function clasesDesde(alumnoId,desdeISO){
  let n=0;
  D.asistencia.forEach(s=>{
    if(desdeISO && s.fecha < desdeISO) return;
    if((s.presentes||[]).includes(alumnoId)) n++;
  });
  return n;
}
function totalClases(alumnoId){ return clasesDesde(alumnoId,null); }
function ultimaClase(alumnoId){
  let u=null;
  D.asistencia.forEach(s=>{ if((s.presentes||[]).includes(alumnoId)) { if(!u||s.fecha>u) u=s.fecha; } });
  return u;
}
/* desde cuándo tiene el cinturón actual */
function desdeCinturon(a){
  if(a.historial && a.historial.length){
    const ult=a.historial.slice().sort((x,y)=>x.fecha.localeCompare(y.fecha)).slice(-1)[0];
    if(ult && ult.fecha) return ult.fecha;
  }
  return a.desde||a.creado||hoyISO();
}
/* ¿puede examinarse? */
function elegibilidad(a){
  const c=cintDe(a), sig=siguienteCint(c);
  const d0=desdeCinturon(a), hoy=hoyISO();
  const clases=clasesDesde(a.id,d0);
  const meses=mesesEntre(d0,hoy);
  const tot=(c&&c.tecnicas||[]).length;
  const hechas=(c&&c.tecnicas||[]).filter(t=>(a.tecnicas||[]).includes(t.id)).length;
  const faltanClases=Math.max(0,(c&&c.clases||0)-clases);
  const faltanMeses=Math.max(0,(c&&c.meses||0)-meses);
  const faltanTec=Math.max(0,tot-hechas);
  return {c,sig,clases,meses,tot,hechas,faltanClases,faltanMeses,faltanTec,
    listo: !sig? false : (faltanClases===0 && faltanMeses===0 && faltanTec===0),
    casi: !sig? false : (faltanClases+faltanMeses+faltanTec)>0 && (faltanClases<=4 && faltanMeses<=1 && faltanTec<=2)};
}

let FOTO_TMP='';

function comprimirFoto(file,cb){
  const fr=new FileReader();
  fr.onload=e=>{ const img=new Image();
    img.onload=()=>{
      const max=380, s=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*s), h=Math.round(img.height*s);
      const lado=Math.min(w,h);
      const cv=document.createElement('canvas'); cv.width=lado; cv.height=lado;
      const cx=cv.getContext('2d');
      cx.drawImage(img,(w-lado)/2/s,(h-lado)/2/s,lado/s,lado/s,0,0,lado,lado);
      cb(cv.toDataURL('image/jpeg',0.62));
    };
    img.src=e.target.result; };
  fr.readAsDataURL(file);
}

/* ---------- edad ---------- */
function edadDe(nacim){
  if(!nacim) return null;
  const [a,m,d]=String(nacim).split('-').map(Number);
  if(!a) return null;
  const hoy=new Date(); let e=hoy.getFullYear()-a;
  const cumpleYa=(hoy.getMonth()+1>m)||((hoy.getMonth()+1===m)&&(hoy.getDate()>=d));
  if(!cumpleYa) e--;
  return e;
}
function esMenor(a){ const e=edadDe(a&&a.nacim); return e===null? false : e<18; }
/* cuántos días faltan para su cumpleaños */
function diasParaCumple(nacim){
  if(!nacim) return null;
  const [,m,d]=String(nacim).split('-').map(Number);
  if(!m||!d) return null;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  let c=new Date(hoy.getFullYear(),m-1,d);
  if(c<hoy) c=new Date(hoy.getFullYear()+1,m-1,d);
  return Math.round((c-hoy)/86400000);
}

function sugerencias(campo){
  const s=new Set();
  (D.alumnos||[]).forEach(a=>{
    const gente=[a,a.madre,a.padre,a.emerg].filter(Boolean);
    gente.forEach(p=>{
      if(campo==='nombre'){ if(p.nombre)s.add(p.nombre); if(p.nom)s.add(p.nom); }
      if(campo==='apellido'){ [p.apellido,p.apellido2,p.ape1,p.ape2].forEach(x=>{if(x)s.add(x);}); }
      if(campo==='calle'&&p.calle)s.add(p.calle);
      if(campo==='ciudad'&&p.ciudad)s.add(p.ciudad);
      if(campo==='zip'&&p.zip)s.add(p.zip);
      if(campo==='tel'){ [p.tel,p.telefono].forEach(x=>{if(x)s.add(x);}); }
    });
  });
  return [...s].filter(Boolean).sort();
}

function calcCuota(){
  const bec=$('al-beca'), caja=$('al-becacaja');
  if(caja) caja.style.display = bec&&bec.checked ? 'grid' : 'none';
  const frec=$('al-frec')?$('al-frec').value:'mensual';
  const base = $('al-cuota').value===''? n2(D.config.cuota) : n2($('al-cuota').value);
  const f=porId(D.familias,$('al-fam').value);
  const desc = f&&Number(f.descuento)>0 ? n2(base*Number(f.descuento)/100) : 0;
  const neto = n2(base-desc);
  const veces = VECES_AL_MES[frec]||1;
  const becado = bec&&bec.checked;
  const etq = {semanal:'cada semana',quincenal:'cada quincena',mensual:'cada mes'}[frec];
  $('al-calc').innerHTML = `
    <div class="fila"><span class="gris">Cuota ${etq}</span><span class="mono">${money(base)}</span></div>
    ${desc?`<div class="fila"><span class="gris">Descuento de familia (−${f.descuento}%)</span><span class="mono ambar">−${money(desc)}</span></div>`:''}
    <div class="fila"><span><b>Le toca pagar ${etq}</b></span><span class="mono ${becado?'gris':'verde'}"><b>${becado?'—':money(neto)}</b></span></div>
    <div class="fila"><span class="gris">Al mes serían</span><span class="mono">${becado?'becado, no paga':money(n2(neto*veces))}</span></div>`;
}

    estado:$('al-estado').value, zip:($('al-zip').value||'').trim(),
    grupoId:$('al-grupo').value, desde:$('al-desde').value||hoyISO(),
    cinturonId:$('al-cint').value, dias, talla:$('al-talla').value,
    estadoAl, activo: estadoAl!=='baja',
    inscMonto: $('al-insc').value===''? '' : n2($('al-insc').value),
    inscFecha: $('al-inscf').value||'', inscUniforme: $('al-inscuni').checked,
    frecuencia: $('al-frec').value,
    cuota: $('al-cuota').value===''? '' : n2($('al-cuota').value),
    familiaId:$('al-fam').value,
    beca:{activa:$('al-beca').checked, desde:$('al-becadesde').value||mesActual(),
          meses:Number($('al-becameses').value)||1},
    waiver:{firmado:$('al-waiver').checked, fecha:$('al-waiverf').value||''},
    medico:($('al-medico').value||'').trim(), recogen:($('al-recogen').value||'').trim(),
    permisoFotos:$('al-fotos').checked,
    nota:($('al-nota').value||'').trim()};
  const menor = esMenor({nacim:o.nacim});
  o.madre = menor ? (leerPersona('ma',false)||personaVacia()) : ((porId(D.alumnos,id)||{}).madre||personaVacia());
  o.padre = menor ? (leerPersona('pa',false)||personaVacia()) : ((porId(D.alumnos,id)||{}).padre||personaVacia());
  o.emerg = leerPersona('em',true)||personaVacia();
  if(FOTO_TMP) o.foto=FOTO_TMP;
  if(id){ Object.assign(porId(D.alumnos,id),o); log('Modificó a '+n); }
  else { D.alumnos.push({id:uid(),historial:[],tecnicas:[],rayas:0,creado:hoyISO(),...o});

  if(!guardar()) return;
  toast('Guardado'); FOTO_TMP=''; ALUMNO_EDIT=null;
  if(otroMas){ cerrarHoja(); editarAlumno(); }

/* ---------- AVISOS DE HOY ---------- */
function avisosDeHoy(){
  const hoy=hoyISO(), mk=mesActual(), out=[];
  alumnosActivos().forEach(a=>{
    const d=diasParaCumple(a.nacim);
    if(d!==null && d<=7){
      const ed=edadDe(a.nacim);
      out.push({tipo:'cump', a, orden:d,
        txt:`🎂 ${nombreCorto(a)} cumple ${ed===null?'':(ed+1)+' años'} ${d===0?'HOY':(d===1?'mañana':'en '+d+' días')}`});
    }
  });
  const deben=deudoresDelMes(mk);
  const vence=mk+'-'+String(D.config.diaVence||5).padStart(2,'0');
  deben.forEach(a=>{
    const dias=diasEntre(vence,hoy);              // + atrasado, − todavía no vence
    if(dias < -4) return;                          // falta mucho, no molesta
    const cola = dias>0 ? ' · '+dias+' días de atraso'
               : (dias===0 ? ' · VENCE HOY' : ' · vence en '+(-dias)+' días');
    out.push({tipo:'deu', a, orden:100-Math.min(99,dias),
      txt:`💵 ${nombreCorto(a)} debe ${money(debeDelMes(a,mk))}${cola}`});
  });
  alumnosActivos().forEach(a=>{
    if(becadoEn(a,mk) && ultimoMesBeca(a)===mk)
      out.push({tipo:'bec', a, orden:50, txt:`🎓 A ${nombreCorto(a)} se le acaba la beca este mes`});
  });
  alumnosActivos().forEach(a=>{
    if(!(a.waiver&&a.waiver.firmado) && diasEntre(a.desde||hoy,hoy)>14)
      out.push({tipo:'bec', a, orden:60, txt:`📄 ${nombreCorto(a)} todavía no ha firmado el permiso`});
  });
  return out.sort((x,y)=>x.orden-y.orden);
}
function avisosHTML(){
  const av=avisosDeHoy();
  if(!av.length) return '';
  const ver=av.slice(0,6);
  return `<div class="card"><div class="hd">🔔 Avisos de hoy (${av.length})</div>

/* =========================== CUOTAS =========================== */
/* lo que le toca pagar CADA VEZ (según su frecuencia) */
function cuotaPorVez(a){
  let base = (a.cuota===''||a.cuota===undefined||a.cuota===null) ? n2(D.config.cuota) : n2(a.cuota);
  const f=porId(D.familias,a.familiaId);
  if(f && Number(f.descuento)>0) base = n2(base*(1-Number(f.descuento)/100));
  return base;
}
/* a quién se le avisa: si es menor, a la madre o al padre; si no, a él */
function telDeAviso(a){
  if(!a) return '';
  if(esMenor(a)) return (a.madre&&a.madre.tel)||(a.padre&&a.padre.tel)||(a.emerg&&a.emerg.tel)||a.tel||'';
  return a.tel||(a.emerg&&a.emerg.tel)||'';
}
function vecesAlMes(a){ return VECES_AL_MES[a&&a.frecuencia||'mensual']||1; }
function etiquetaFrec(a){ return {semanal:'cada semana',quincenal:'cada quincena',mensual:'cada mes'}[a&&a.frecuencia||'mensual']; }
/* ¿está becado ese mes? */
function becadoEn(a,mk){
  const b=a&&a.beca;
  if(!b||!b.activa||!b.desde) return false;
  const [a1,m1]=b.desde.split('-').map(Number);
  const [a2,m2]=String(mk).split('-').map(Number);
  const dif=(a2-a1)*12+(m2-m1);
  return dif>=0 && dif < (Number(b.meses)||1);
}
function ultimoMesBeca(a){
  const b=a&&a.beca; if(!b||!b.activa||!b.desde) return '';
  const [a1,m1]=b.desde.split('-').map(Number);
  const tot=(m1-1)+(Number(b.meses)||1)-1;
  return (a1+Math.floor(tot/12))+'-'+String((tot%12)+1).padStart(2,'0');
}
/* lo que le toca en TODO el mes */
function cuotaDe(a,mk){
  if(a.estadoAl==='pausa') return 0;
  if(mk && becadoEn(a,mk)) return 0;
  if(!mk && becadoEn(a,mesActual())) return 0;
  return n2(cuotaPorVez(a)*vecesAlMes(a));
}
function pagadoDelMes(alumnoId,mk){
  return n2(D.pagos.filter(p=>p.alumnoId===alumnoId && p.mes===mk).reduce((s,p)=>s+n2(p.monto),0));
}
function debeDelMes(a,mk){
  if(a.activo===false) return 0;
  if(a.desde && mesClave(a.desde) > mk) return 0;
  return n2(Math.max(0, cuotaDe(a,mk)-pagadoDelMes(a.id,mk)));
}
function deudoresDelMes(mk){
  return alumnosActivos().filter(a=>debeDelMes(a,mk)>0)
    .sort((x,y)=>debeDelMes(y,mk)-debeDelMes(x,mk));
}
function esperadoDelMes(mk){
  return n2(alumnosActivos().filter(a=>!(a.desde&&mesClave(a.desde)>mk)).reduce((s,a)=>s+cuotaDe(a,mk),0));
}
function cobradoDelMes(mk){ return n2(D.pagos.filter(p=>p.mes===mk).reduce((s,p)=>s+n2(p.monto),0)); }

let CUOTA_MES='';
PINTORES.cuotas=()=>{
  if(!CUOTA_MES) CUOTA_MES=mesActual();
  const mk=CUOTA_MES;
  const esp=esperadoDelMes(mk), cob=cobradoDelMes(mk);
  const deben=deudoresDelMes(mk);
  const alDia=alumnosActivos().filter(a=>debeDelMes(a,mk)<=0);
  const hoy=hoyISO();
  const vence=mk+'-'+String(D.config.diaVence||5).padStart(2,'0');
  $('v-cuotas').innerHTML=`
  <div class="card tight">
    <div class="campo" style="margin:0"><label>Mes</label>
      <select onchange="CUOTA_MES=this.value;PINTORES.cuotas()">
        ${mesesDisponibles().map(m=>`<option value="${m}"${m===mk?' selected':''}>${esc(mesBonito(m))}</option>`).join('')}
      </select></div>
  </div>
  <div class="card">
    <div class="hd">💵 ${esc(mesBonito(mk))}</div>
    <div class="fila"><span>Cobrado</span><span class="big verde">${money(cob)}</span></div>
    <div class="fila"><span>Falta</span><span class="big ${esp-cob>0?'ambar':'verde'}">${money(Math.max(0,esp-cob))}</span></div>
    <div class="total"><span class="gris">Esperado de ${alumnosActivos().length} alumnos</span><b class="num">${money(esp)}</b></div>
    <div class="barra-b v" style="margin-top:8px"><i style="width:${esp?Math.min(100,Math.round(cob/esp*100)):0}%"></i></div>
  </div>
  <div class="card">
    <div class="hd">⚠️ Deben (${deben.length})</div>
    ${deben.length?deben.map(a=>{
      const d=debeDelMes(a,mk), dias=diasEntre(vence,hoy);
      return `<div class="fila">
        <div class="avatar sm" style="${a.foto?`background-image:url(${a.foto})`:''}">${a.foto?'':'👤'}</div>
        <div class="izq"><div class="n1">${esc(nombreAlumno(a))}</div>
        <div class="n2">${money(d)}${mk===mesActual()?(dias>0?' · '+dias+' días de atraso':(dias===0?' · vence hoy':' · vence el '+(D.config.diaVence||5))):''}</div></div>
        <div style="text-align:right">
          <button class="btn chico" onclick="registrarPago('${a.id}')">Pagó</button>
          ${telDeAviso(a)?`<a class="btn chico" style="margin-top:4px;display:block" href="sms:${esc(telDeAviso(a))}">📲</a>`:''}
        </div></div>`;}).join('')
      :'<div class="nota ok">✅ Todos al día este mes.</div>'}
  </div>
  <div class="card">
    <div class="hd">✅ Al día (${alDia.length})</div>
    ${alDia.length?alDia.map(a=>`<div class="fila">
      <div class="avatar sm" style="${a.foto?`background-image:url(${a.foto})`:''}">${a.foto?'':'👤'}</div>
      <div class="izq"><div class="n1">${esc(nombreAlumno(a))}</div>
      <div class="n2">pagó ${money(pagadoDelMes(a.id,mk))}</div></div>
      <button class="btn chico" onclick="verPagos('${a.id}')">Ver</button></div>`).join('')
      :'<div class="vacio-msj">Nadie todavía.</div>'}
  </div>
  <button class="btn" onclick="ir('reportes')">📊 Ver el año completo</button>
  <div class="card">
    <div class="hd">Ajustes de cuota</div>
    <div class="dosc">
      <div class="campo"><label>Cuota general</label>
        <input type="number" step="0.01" value="${D.config.cuota}" onchange="D.config.cuota=n2(this.value);guardar();PINTORES.cuotas()"></div>
      <div class="campo"><label>Vence el día</label>
        <input type="number" min="1" max="28" value="${D.config.diaVence||5}" onchange="D.config.diaVence=Number(this.value)||5;guardar();PINTORES.cuotas()"></div>
    </div>
    <div class="mini">Un alumno puede tener su propia cuota distinta en su ficha.</div>
  </div>`;
};
function mesesDisponibles(){
  const s=new Set([mesActual()]);
  D.pagos.forEach(p=>s.add(p.mes));
  const hoy=new Date();
  for(let i=0;i<14;i++){ const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
    s.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  return [...s].filter(Boolean).sort().reverse();
}
function registrarPago(alumnoId){
  const a=porId(D.alumnos,alumnoId);
  const mk=CUOTA_MES||mesActual();
  const falta=debeDelMes(a,mk);
  hoja('Pago de '+nombreAlumno(a),`
   <div class="dosc">
     <div class="campo"><label>Mes que paga</label><select id="pg-mes">
       ${mesesDisponibles().map(m=>`<option value="${m}"${m===mk?' selected':''}>${esc(mesBonito(m))}</option>`).join('')}
     </select></div>
     <div class="campo"><label>Fecha</label><input type="date" id="pg-fecha" value="${hoyISO()}"></div>
   </div>
   <div class="dosc">
     <div class="campo"><label>Monto</label><input type="number" step="0.01" id="pg-monto" value="${falta>0?falta:cuotaPorVez(a)}"></div>
     <div class="campo"><label>Cómo pagó</label><select id="pg-como">
       ${['Efectivo','Cheque','Zelle','Tarjeta','Transferencia','Otro'].map(x=>`<option>${x}</option>`).join('')}
     </select></div>
   </div>
   <div class="campo"><label>Nota</label><input id="pg-nota" placeholder="opcional"></div>
   <button class="btn pri" onclick="guardarPago('${alumnoId}')">Guardar el pago</button>
   <div class="mini" style="margin-top:9px">Paga ${money(cuotaPorVez(a))} ${esc(etiquetaFrec(a))} · al mes ${money(cuotaDe(a,mk))}${falta>0?' · debe '+money(falta):' · ya está al día'}${becadoEn(a,mk)?' · 🎓 BECADO este mes':''}.</div>`);
}
function guardarPago(alumnoId){
  const m=n2($('pg-monto').value);
  if(!(m>0)) return toast('Escribe un monto mayor que cero.');
  const a=porId(D.alumnos,alumnoId);
  D.pagos.push({id:uid(),alumnoId,mes:$('pg-mes').value,fecha:$('pg-fecha').value||hoyISO(),
    monto:m,metodo:$('pg-como').value,nota:($('pg-nota').value||'').trim()});
  log('Pago de '+nombreAlumno(a)+': '+money(m)+' de '+mesBonito($('pg-mes').value));
  guardar(); cerrarHoja(); toast('Pago guardado'); pintar();
}
function verPagos(alumnoId){
  const a=porId(D.alumnos,alumnoId);
  const ps=D.pagos.filter(p=>p.alumnoId===alumnoId).sort((x,y)=>y.fecha.localeCompare(x.fecha));
  hoja('Pagos de '+nombreAlumno(a),
   (ps.length?ps.map(p=>`<div class="fila"><div class="izq">
      <div class="n1">${esc(mesBonito(p.mes))}</div>
      <div class="n2">${fLarga(p.fecha)} · ${esc(p.metodo||'')}${p.nota?' · '+esc(p.nota):''}</div></div>
      <div style="text-align:right"><div class="mono verde">${money(p.monto)}</div>
      <button class="btn chico peligro" onclick="borrarPago('${p.id}','${alumnoId}')">🗑️</button></div></div>`).join('')
    :'<div class="vacio-msj">Todavía no tiene pagos anotados.</div>')
   +`<button class="btn pri" style="margin-top:10px" onclick="cerrarHoja();registrarPago('${alumnoId}')">➕ Anotar un pago</button>`);
}
async function borrarPago(id,alumnoId){
  const p=porId(D.pagos,id);
  if(!confirm('¿Borrar este pago de '+money(p.monto)+'?')) return;
  if(!await confirmarDueno('borrar un pago de '+money(p.monto))) return;
  D.pagos=D.pagos.filter(x=>x.id!==id); log('Borró un pago de '+money(p.monto));
  guardar(); toast('Borrado'); verPagos(alumnoId);
}

function editarCinturon(id){

       <button class="btn chico peligro" onclick="borrarTecnica('${c.id}','${t.id}')">🗑️</button></div>`).join('')}</div>
     <div class="campo" style="margin-top:8px"><input id="ci-nueva" placeholder="Agregar una técnica…">

    :'<div class="mini">Guárdalo primero y después le agregas las técnicas.</div>'}
   <button class="btn pri" style="margin-top:10px" onclick="guardarCinturon('${id||''}')">Guardar</button>
   ${id?`<button class="btn peligro" style="margin-top:8px" onclick="borrarCinturon('${id}')">🗑️ Borrar cinturón</button>`:''}`);

function previaCinta(){
  const p=$('ci-previa'); if(!p) return;
  p.innerHTML=cintaHTML({base:$('ci-base').value,franja:$('ci-franja').value,
    color:COLOR_CINT[$('ci-base').value]},'gr');
}
function guardarCinturon(id){
  const n=($('ci-nom').value||'').trim(); if(!n) return toast('Ponle un nombre.');
  const base=$('ci-base').value, franja=$('ci-franja').value;
  const o={nombre:n,base,franja,color:COLOR_CINT[base]||'#888',kyu:($('ci-kyu').value||'').trim(),
    clases:Number($('ci-clases').value)||0,meses:Number($('ci-meses').value)||0,rayas:0,
    orden:Number($('ci-orden').value)||0};
  if(id){ Object.assign(porId(D.cinturones,id),o); log('Modificó el cinturón '+n); }
  else { D.cinturones.push({id:uid(),tecnicas:[],...o}); log('Agregó el cinturón '+n); }
  guardar(); cerrarHoja(); toast('Guardado'); ir('cinturones');
}
function agregarTecnica(cid){
  const n=($('ci-nueva').value||'').trim(); if(!n) return toast('Escribe la técnica.');
  const c=porId(D.cinturones,cid); c.tecnicas=c.tecnicas||[];
  c.tecnicas.push({id:uid(),nombre:n});
  log('Agregó la técnica "'+n+'" a '+c.nombre);
  guardar(); editarCinturon(cid);
}
function borrarTecnica(cid,tid){
  const c=porId(D.cinturones,cid), t=(c.tecnicas||[]).find(x=>x.id===tid);
  if(!confirm('¿Borrar la técnica "'+(t?t.nombre:'')+'"?')) return;
  c.tecnicas=c.tecnicas.filter(x=>x.id!==tid);
  D.alumnos.forEach(a=>{ a.tecnicas=(a.tecnicas||[]).filter(x=>x!==tid); });
  log('Borró la técnica "'+(t?t.nombre:'')+'"');
  guardar(); editarCinturon(cid);
}
async function borrarCinturon(id){
  const c=porId(D.cinturones,id);
  const n=D.alumnos.filter(a=>a.cinturonId===id).length;
  if(n) return alert('No se puede borrar: '+n+' alumno(s) tienen el cinturón '+c.nombre+'.');
  if(!confirm('¿Borrar el cinturón '+c.nombre+'?')) return;
  if(!await confirmarDueno('borrar el cinturón '+c.nombre)) return;
  D.cinturones=D.cinturones.filter(x=>x.id!==id); log('Borró el cinturón '+c.nombre);
  guardar(); cerrarHoja(); toast('Borrado'); ir('cinturones');
}

    <b>Cinturones y técnicas</b>. La app solo cuenta.</div>`;
};

        <div class="puntaje">${[1,2,3,4,5].map(v=>
          `<button class="${al[k]===v?'sel':''}" onclick="puntuar('${x.id}',${i},'${k}',${v})">${v}</button>`).join('')}</div>
      </div>`).join('')}
      <div class="campo" style="margin-top:8px"><input placeholder="Nota del examen…" value="${esc(al.nota||'')}"
        onchange="notaExamen('${x.id}',${i},this.value)"></div>
      <div class="dosc">
        <button class="btn" style="${al.paso===true?'background:#33503c;border-color:var(--verde);color:var(--verde)':''}"
          onclick="decidir('${x.id}',${i},true)">✅ PASA</button>
        <button class="btn" style="${al.paso===false?'background:#4e2c29;border-color:var(--rojo);color:var(--rojo)':''}"
          onclick="decidir('${x.id}',${i},false)">❌ NO PASA</button>
      </div>
    </div>`;}).join('')}
  ${!x.cerrado?`<button class="btn pri" onclick="cerrarExamen('${x.id}')">🏁 Terminar y promover a los que pasaron</button>`:
    `<div class="nota ok">Este examen ya está terminado. Los que pasaron ya tienen su cinturón nuevo.</div>`}
  <button class="btn peligro" style="margin-top:8px" onclick="borrarExamen('${x.id}')">🗑️ Borrar examen</button>`;
};
function puntuar(exId,i,k,v){
  const x=porId(D.examenes,exId); if(x.cerrado) return toast('Este examen ya está terminado.');
  x.alumnos[i][k]=v; guardar(); PINTORES.examen();
}
function notaExamen(exId,i,v){ const x=porId(D.examenes,exId); x.alumnos[i].nota=v; guardar(); }
function decidir(exId,i,paso){
  const x=porId(D.examenes,exId); if(x.cerrado) return toast('Este examen ya está terminado.');
  x.alumnos[i].paso = x.alumnos[i].paso===paso ? null : paso;
  guardar(); PINTORES.examen();
}
async function cerrarExamen(exId){
  const x=porId(D.examenes,exId);
  const sin=(x.alumnos||[]).filter(a=>a.paso===null).length;
  if(sin && !confirm('Todavía hay '+sin+' alumno(s) sin decidir.\n\n¿Terminar de todos modos? A esos no les pasa nada.')) return;
  if(!await confirmarDueno('terminar el examen y promover a los que pasaron')) return;
  let n=0;
  (x.alumnos||[]).forEach(al=>{
    if(al.paso!==true) return;
    const a=porId(D.alumnos,al.alumnoId); if(!a||!al.aId) return;
    a.historial=a.historial||[];
    a.historial.push({cinturonId:al.aId, fecha:x.fecha,
      nota:CRITERIOS.map(k=>k+' '+(al[k]||'-')).join(' · ')+(al.nota?' · '+al.nota:'')});
    a.cinturonId=al.aId; a.rayas=0; a.tecnicas=[];
    n++;
  });
  x.cerrado=true;
  log('Terminó el examen "'+x.nombre+'": '+n+' promovidos');
  guardar(); toast(n+' promovidos'); pintar();
}
async function borrarExamen(exId){
  const x=porId(D.examenes,exId);
  if(!confirm('¿Borrar el examen "'+x.nombre+'"?\n\nLas promociones que ya se hicieron NO se deshacen.')) return;
  if(!await confirmarDueno('borrar el examen '+x.nombre)) return;
  D.examenes=D.examenes.filter(e=>e.id!==exId); log('Borró el examen "'+x.nombre+'"');
  guardar(); toast('Borrado'); ir('examenes');
}
function promoverAlumno(id){
  const a=porId(D.alumnos,id), c=cintDe(a), sig=siguienteCint(c);
  if(!sig) return toast('Ya está en el último cinturón.');
  hoja('Promover a '+nombreAlumno(a),`
   <div class="nota">${cintaHTML(c,true)} ${esc(c.nombre)} → ${cintaHTML(sig,true)} <b>${esc(nombreGrado(sig))}</b></div>
   <div class="campo"><label>Fecha del examen</label><input type="date" id="pr-fecha" value="${hoyISO()}"></div>
   <div class="campo"><label>Nota</label><input id="pr-nota" placeholder="opcional"></div>
   <button class="btn pri" onclick="confirmarPromocion('${id}')">Promover</button>`);
}
function confirmarPromocion(id){
  const a=porId(D.alumnos,id), c=cintDe(a), sig=siguienteCint(c);
  a.historial=a.historial||[];
  a.historial.push({cinturonId:sig.id,fecha:$('pr-fecha').value||hoyISO(),nota:($('pr-nota').value||'').trim()});
  a.cinturonId=sig.id; a.rayas=0; a.tecnicas=[];
  log('Promovió a '+nombreAlumno(a)+' a '+sig.nombre);
  guardar(); cerrarHoja(); toast('Promovido a '+sig.nombre); pintar();
}

let REP_ANIO=0;
PINTORES.reportes=()=>{
  if(!REP_ANIO) REP_ANIO=new Date().getFullYear();
  const a=REP_ANIO, mk=mesActual();
  const act=alumnosActivos();
  const desp=seDespegan();

  /* asistencia promedio del mes */
  const ses=D.asistencia.filter(s=>mesClave(s.fecha)===mk);
  let sumaP=0, sumaE=0;
  ses.forEach(s=>{ sumaP+=(s.presentes||[]).length; sumaE+=alumnosDeGrupo(s.grupoId).length; });
  const prom = sumaE? Math.round(sumaP/sumaE*100) : 0;

  /* entradas y salidas del mes */
  const nuevos=D.alumnos.filter(x=>mesClave(x.desde||x.creado)===mk).length;

  /* por cinturón */
  const porCint=D.cinturones.slice().sort((x,y)=>x.orden-y.orden)
    .map(c=>({c,n:act.filter(x=>x.cinturonId===c.id).length})).filter(x=>x.n>0);
  const maxC=porCint.reduce((m,x)=>Math.max(m,x.n),1);

  /* dinero del año, mes a mes */
  const meses=[];
  for(let m=1;m<=12;m++){
    const k=a+'-'+String(m).padStart(2,'0');
    meses.push({m,k,cob:cobradoDelMes(k),esp:esperadoDelMes(k)});
  }
  const totCob=n2(meses.reduce((s,x)=>s+x.cob,0));

  /* quién paga tarde */
  const tarde=act.map(x=>{
    let n=0;
    meses.forEach(mm=>{ if(mm.k<=mk && debeDelMes(x,mm.k)>0) n++; });
    return {a:x,n};
  }).filter(x=>x.n>0).sort((p,q)=>q.n-p.n).slice(0,8);

  $('v-reportes').innerHTML=`
  <div class="card">
    <div class="hd">📊 ${esc(mesBonito(mk))}</div>
    <div class="fila"><span>Alumnos activos</span><span class="mono">${act.length}</span></div>
    <div class="fila"><span>Entraron este mes</span><span class="mono verde">${nuevos}</span></div>
    <div class="fila"><span>Se han ido (en total)</span><span class="mono">${D.alumnos.filter(x=>x.activo===false).length}</span></div>
    <div class="fila"><span>Clases dadas este mes</span><span class="mono">${ses.length}</span></div>
    <div class="fila"><span>Asistencia promedio</span><span class="mono ${prom>=70?'verde':'ambar'}">${prom}%</span></div>
    <div class="barra-b ${prom>=70?'v':'a'}"><i style="width:${prom}%"></i></div>
  </div>

  <div class="card">
    <div class="hd">⚠️ Ojo con estos (${desp.length})</div>
    <div class="mini" style="margin-bottom:8px">Un alumno no se va de un día para otro: primero deja de venir.</div>
    ${desp.length?desp.map(x=>`<button class="fila" style="width:100%;text-align:left" onclick="abrirAlumno('${x.a.id}')">
      <div class="avatar sm" style="${x.a.foto?`background-image:url(${x.a.foto})`:''}">${x.a.foto?'':'👤'}</div>
      <div class="izq"><div class="n1">${esc(nombreAlumno(x.a))}</div>
      <div class="n2">${x.nunca?'nunca ha venido':'no viene hace '+x.dias+' días'}${telDeAviso(x.a)?' · '+esc(telDeAviso(x.a)):''}</div></div>
      ${telDeAviso(x.a)?`<a class="btn chico" href="tel:${esc(telDeAviso(x.a))}" onclick="event.stopPropagation()">📞</a>`:'<span class="fl gris">›</span>'}
      </button>`).join('')
      :'<div class="nota ok">✅ Todos vienen seguido.</div>'}
  </div>

  <div class="card">
    <div class="hd">🥋 Cómo están repartidos los cinturones</div>
    ${porCint.length?porCint.map(x=>`<div style="padding:6px 0">
      <div style="display:flex;justify-content:space-between;font-size:14px">
        <span>${cintaHTML(x.c,true)} ${esc(x.c.nombre)}</span><span class="mono">${x.n}</span></div>
      <div class="barra-b"><i style="width:${Math.max(4,x.n/maxC*100)}%"></i></div></div>`).join('')
      :'<div class="vacio-msj">Todavía no hay alumnos.</div>'}
  </div>

  <div class="card" style="overflow-x:auto">
    <div class="hd">💵 El año ${a}</div>
    <table class="t"><thead><tr><th>Mes</th><th>Cobrado</th><th>Esperado</th><th>Falta</th></tr></thead><tbody>
    ${meses.map(x=>`<tr><td class="gris">${MES3[x.m]}</td>
      <td class="verde">${x.cob?money(x.cob):'–'}</td>
      <td>${x.esp?money(x.esp):'–'}</td>
      <td class="${x.esp-x.cob>0?'ambar':''}">${x.esp-x.cob>0?money(x.esp-x.cob):'–'}</td></tr>`).join('')}
    <tr><td><b>TOTAL</b></td><td><b class="verde">${money(totCob)}</b></td><td></td><td></td></tr>
    </tbody></table>
  </div>

  <div class="card">
    <div class="hd">⏰ Los que más se atrasan</div>
    ${tarde.length?tarde.map(x=>`<button class="fila" style="width:100%;text-align:left" onclick="abrirAlumno('${x.a.id}')">
      <div class="izq"><div class="n1">${esc(nombreAlumno(x.a))}</div>
      <div class="n2">${x.n} mes${x.n===1?'':'es'} sin pagar completo</div></div>
      <span class="fl gris">›</span></button>`).join('')
      :'<div class="nota ok">✅ Nadie se atrasa.</div>'}
  </div>
  <button class="btn" onclick="compartirResumen()">📤 Compartir el resumen</button>`;
};
function textoResumen(){
  const mk=mesActual(), act=alumnosActivos();
  let t=(D.escuela&&D.escuela.nombre||'DOJO')+'\n';
  t+='Resumen de '+mesBonito(mk)+'\n'+'='.repeat(40)+'\n\n';
  t+='Alumnos activos ........ '+act.length+'\n';
  D.grupos.forEach(g=>t+='  '+g.nombre+' ('+horarioGrupo(g)+') ... '+alumnosDeGrupo(g.id).length+'\n');
  t+='\nCobrado ................ '+money(cobradoDelMes(mk))+'\n';
  t+='Esperado ............... '+money(esperadoDelMes(mk))+'\n';
  t+='Falta .................. '+money(Math.max(0,esperadoDelMes(mk)-cobradoDelMes(mk)))+'\n';
  const deben=deudoresDelMes(mk);
  if(deben.length){ t+='\nDEBEN ('+deben.length+'):\n';
    deben.forEach(a=>t+='  '+nombreAlumno(a)+' — '+money(debeDelMes(a,mk))+'\n'); }
  const listos=act.map(a=>({a,e:elegibilidad(a)})).filter(x=>x.e.listo);
  if(listos.length){ t+='\nLISTOS PARA EXAMEN ('+listos.length+'):\n';
    listos.forEach(x=>t+='  '+nombreAlumno(x.a)+' — '+(x.e.c?x.e.c.nombre:'')+' → '+(x.e.sig?x.e.sig.nombre:'')+'\n'); }
  const desp=seDespegan();
  if(desp.length){ t+='\nNO ESTÁN VINIENDO ('+desp.length+'):\n';
    desp.forEach(x=>t+='  '+nombreAlumno(x.a)+' — '+(x.nunca?'nunca':x.dias+' días')+'\n'); }
  return t;
}
async function compartirResumen(){
  const t=textoResumen();
  try{ if(navigator.share){ await navigator.share({title:'Resumen del dojo',text:t}); return; } }catch(e){}
  hoja('Resumen',
    `<textarea readonly style="height:56vh;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px">${esc(t)}</textarea>
     <button class="btn pri" style="margin-top:9px" onclick="copiarTexto(this)">Copiar todo</button>`);
}
function copiarTexto(btn){
  const ta=btn.parentElement.querySelector('textarea');
  ta.select(); try{document.execCommand('copy');toast('Copiado');}catch(e){toast('Selecciónalo y cópialo a mano');}
}
function bajar(txt,nombre,tipo){
  const b=new Blob([txt],{type:tipo||'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=nombre; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u);},900);
}

  const disp=await huellaDisponible(); const h=D.config.huella;
  if(!disp){ c.innerHTML=`<div class="nota al">Este aparato no ofrece lector de huella al navegador.
    En el teléfono normalmente sí. Tu clave siempre funciona.</div>`; return; }
  c.innerHTML = (h&&h.activa)
   ? `<div class="nota ok">👆 Huella registrada en este aparato.</div>
      <label class="mini" style="display:block;margin:9px 0">
        <input type="checkbox" ${D.config.huellaBorrar!==false?'checked':''} style="width:auto;margin-right:7px"
          onchange="D.config.huellaBorrar=this.checked;guardar();toast('Guardado')">
        Pedirme la huella antes de borrar cosas</label>
      <button class="btn peligro" onclick="quitarHuella()">Quitar la huella de este aparato</button>`
   : `<div class="mini" style="margin-bottom:9px">Entra con tu huella en vez de escribir la clave. Se registra por aparato.</div>
      <button class="btn pri" onclick="registrarHuella()">👆 Registrar mi huella</button>`;
}
function bajarBackup(){
  const f=new Date(), s=f.getFullYear()+String(f.getMonth()+1).padStart(2,'0')+String(f.getDate()).padStart(2,'0');
  bajar(JSON.stringify(D),`backup_okamura_dojo_${s}.json`,'application/json');
  log('Bajó un backup'); guardar(); toast('Backup bajado');
}
async function restaurarBackup(){
  if(!await confirmarDueno('restaurar un backup encima de todo')) return;
  const f=$('bk-file').files[0]; if(!f) return toast('Escoge primero el archivo del backup.');
  const fr=new FileReader();
  fr.onload=e=>{
    let d; try{ d=JSON.parse(e.target.result); }catch(err){ return alert('Ese archivo no se puede leer.'); }
    if(!d||!d.v||!Array.isArray(d.alumnos)) return alert('Ese archivo no parece un backup de esta app.');
    if(!confirm(`¿Restaurar?\n\nEl backup trae ${d.alumnos.length} alumnos.\nSe reemplaza TODO lo que hay ahora.`)) return;
    const clave=D.clave; D=d; if(!D.clave) D.clave=clave;
    log('Restauró un backup con '+d.alumnos.length+' alumnos');
    guardar(); toast('Restaurado'); ir('inicio');
  };
  fr.readAsText(f);
}
async function cambiarClave(){
  const v=$('sg-vieja').value, n=$('sg-nueva').value;
  if(!v||!n) return toast('Llena las dos casillas.');
  if(n.length<4) return toast('La clave nueva necesita al menos 4 caracteres.');
  if(await hash(v,D.clave.sal)!==D.clave.h) return toast('La clave actual no es correcta.');
  const sal=uid()+uid(); D.clave={sal,h:await hash(n,sal)};
  log('Cambió la clave'); guardar(); toast('Clave cambiada');
  $('sg-vieja').value=''; $('sg-nueva').value='';
}
